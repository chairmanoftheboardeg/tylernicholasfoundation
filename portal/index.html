<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="robots" content="noindex" />

tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{tnf:{green:'#2E9E44',greenDark:'#26863A',greenLight:'#EEF7EF',ink:'#152219',charcoal:'#0E1A13'}}}}}

<style>
  html{overflow-x:hidden}body{overflow-x:clip}
  body{background:#f1f5f4}
  .loader-spinner{border:3px solid rgba(46,158,68,.2);border-left-color:#2E9E44;border-radius:50%;width:44px;height:44px;animation:spin .9s linear infinite}
  .btn-spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}

<body class="font-sans text-gray-900">

<div id="gate" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
  <div class="text-center"><div class="loader-spinner mx-auto mb-4"></div><p id="gate-text" class="text-gray-500 font-semibold text-sm">Checking your access…</p></div>
</div>

<div id="app" class="hidden min-h-screen flex flex-col">
  <div id="staff-banner" class="hidden bg-tnf-ink text-white text-sm">
    <div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-2"><i class="fa-solid fa-circle-info text-tnf-green"></i><span>You're a staff member.</span><a href="/staff" class="font-bold underline underline-offset-2 ml-1">Go to the staff area</a></div>
  </div>
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-2">
      <a href="#" id="home-link" class="flex items-center gap-2.5 shrink-0 mr-1">
        <img src="https://i.ibb.co/BKLps0Qx/TNF-LOGO.jpg" class="h-9 w-9 rounded-lg bg-white object-contain" alt="TNF" />
        <div class="leading-tight hidden sm:block"><div class="font-extrabold text-sm text-tnf-ink">Foundation</div><div class="text-tnf-green text-[11px] font-bold">Volunteer Portal</div></div>
      </a>
      <nav id="nav" class="hidden lg:flex items-center gap-0.5 flex-1 text-sm font-semibold"></nav>
      <div class="flex items-center gap-1 ml-auto shrink-0">
        <div class="relative">
          <button id="bell-btn" class="relative w-10 h-10 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-tnf-ink transition-colors" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span id="bell-badge" class="hidden absolute top-1 right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold grid place-items-center"></span></button>
          <div id="bell-panel" class="hidden absolute right-0 mt-2 w-80 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 z-40 overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100"><span class="font-bold text-tnf-ink text-sm">Notifications</span><button id="bell-readall" class="text-xs font-semibold text-tnf-green hover:text-tnf-greenDark">Mark all read</button></div>
            <div id="bell-list" class="max-h-96 overflow-y-auto"></div>
          </div>
        </div>
        <div class="relative">
          <button id="user-btn" class="flex items-center gap-2 pl-1 pr-1.5 py-1 rounded-lg hover:bg-gray-100 transition-colors">
            <span id="u-avatar" class="w-9 h-9 rounded-full bg-tnf-green grid place-items-center font-bold text-sm text-white flex-none overflow-hidden"></span>
            <span class="hidden md:block text-left leading-tight"><span id="u-name" class="block font-semibold text-sm text-tnf-ink truncate max-w-[150px]"></span><span id="u-role" class="block text-gray-400 text-xs"></span></span>
            <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 hidden md:block"></i>
          </button>
          <div id="user-menu" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-gray-100 z-40 overflow-hidden py-1.5">
            <div class="px-4 py-3 border-b border-gray-100"><div id="um-name" class="font-bold text-tnf-ink text-sm truncate"></div><div id="um-email" class="text-gray-400 text-xs truncate"></div></div>
            <button id="um-home" class="w-full text-left px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700 flex items-center gap-3"><i class="fa-solid fa-house w-4 text-tnf-green"></i>Home</button>
            <a href="/" class="px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700 flex items-center gap-3"><i class="fa-solid fa-arrow-up-right-from-square w-4 text-tnf-green"></i>View public site</a>
            <button id="signout" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-sm text-red-600 flex items-center gap-3"><i class="fa-solid fa-right-from-bracket w-4"></i>Sign out</button>
          </div>
        </div>
        <button id="menu-btn" class="lg:hidden w-10 h-10 rounded-lg hover:bg-gray-100 text-tnf-ink text-xl"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <div id="backdrop" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
  <div id="mobile-drawer" class="fixed top-0 right-0 bottom-0 w-80 max-w-[85vw] bg-white z-50 shadow-2xl translate-x-full transition-transform overflow-y-auto">
    <div class="flex items-center justify-between px-5 h-16 border-b border-gray-100"><span class="font-extrabold text-tnf-ink">Menu</span><button id="drawer-close" class="w-9 h-9 text-gray-500 text-2xl leading-none">&times;</button></div>
    <nav id="mobile-nav" class="p-3 pb-10"></nav>
  </div>

  <div id="subbar" class="bg-white border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <h1 id="page-title" class="text-lg font-bold text-tnf-ink flex-1">Home</h1>
    </div>
  </div>

  <main class="flex-1">
    <div id="content" class="max-w-6xl mx-auto px-4 py-6"></div>
  </main>
</div>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg text-sm font-semibold shadow-lg"></div>

<script>
const SB_URL="https://mcnemlwalcgdlmclijxc.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jbmVtbHdhbGNnZGxtY2xpanhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDMzNTAsImV4cCI6MjEwMjUxOTM1MH0.jVPTsfz7Htho4EZKvHzlgr1vSkj41EuVpMBgaHzLm-Q";
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function toast(msg,ok=true){const t=$('toast');t.textContent=msg;t.className='fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg text-sm font-semibold shadow-lg '+(ok?'bg-tnf-ink text-white':'bg-red-600 text-white');t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3200);}
let db, ME={}, NOTIFS=[], notifChan=null;
const ROLES=[['member','Member'],['volunteer','Volunteer'],['staff','Staff'],['board','Board'],['admin','Admin'],['superadmin','Super Admin']];
function roleLabel(r){return (ROLES.find(x=>x[0]===r)||[])[1]||r||'';}
function shortId(id){return (id||'').replace(/-/g,'').slice(0,6).toUpperCase();}
function avatarHTML(p,cls){const url=p&&p.avatar_url;const ini=(((p&&(p.full_name||p.email))||'?').trim()[0]||'?').toUpperCase();if(url)return `<span class="${cls} rounded-full overflow-hidden inline-block flex-none bg-gray-100"><img src="${esc(url)}" class="w-full h-full object-cover" alt=""></span>`;return `<span class="${cls} rounded-full bg-tnf-green text-white grid place-items-center font-bold flex-none">${esc(ini)}</span>`;}

/* ---------- NAV ---------- */
const NAV=[
  ['home','Home','fa-house'],
  ['hours','My hours','fa-clock'],
  ['announcements','Announcements','fa-bullhorn'],
  ['events','Events','fa-calendar-day'],
  ['opportunities','Opportunities','fa-compass'],
  ['resources','Resources','fa-folder-open'],
  ['details','My details','fa-id-card'],
];
function buildNav(){
  const d=$('nav'),m=$('mobile-nav');d.innerHTML='';m.innerHTML='';
  NAV.forEach(([k,label,ic])=>{
    const b=el(`<button data-key="${k}" class="nav-item flex items-center gap-1.5 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-tnf-ink transition-colors"><i class="fa-solid ${ic}"></i>${label}</button>`);
    b.addEventListener('click',()=>route(k));d.appendChild(b);
    const mb=el(`<button data-key="${k}" class="mnav-item w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-tnf-greenLight text-sm font-semibold"><i class="fa-solid ${ic} w-4 text-tnf-green"></i>${label}</button>`);
    mb.addEventListener('click',()=>{route(k);closeDrawer();});m.appendChild(mb);
  });
}
function setActive(key){document.querySelectorAll('.nav-item,.mnav-item').forEach(n=>{const on=n.dataset.key===key;n.classList.toggle('bg-tnf-greenLight',on);n.classList.toggle('text-tnf-greenDark',on);});}
function openDrawer(){$('mobile-drawer').classList.remove('translate-x-full');$('backdrop').classList.remove('hidden');}
function closeDrawer(){$('mobile-drawer').classList.add('translate-x-full');$('backdrop').classList.add('hidden');}
const TITLES={home:'Home',hours:'My hours',announcements:'Announcements',events:'Events',opportunities:'Opportunities',resources:'Resources',details:'My details'};
function route(key){
  if(window.__homeClock){clearInterval(window.__homeClock);window.__homeClock=null;}
  setActive(key);$('user-menu').classList.add('hidden');window.scrollTo(0,0);
  if(key==='home'){$('subbar').classList.add('hidden');return renderHome();}
  $('subbar').classList.remove('hidden');$('page-title').textContent=TITLES[key]||'';
  if(key==='hours')return renderHours();
  if(key==='announcements')return renderAnnouncements();
  if(key==='events')return renderEvents();
  if(key==='opportunities')return renderOpportunities();
  if(key==='resources')return renderResources();
  if(key==='details')return renderDetails();
}

/* ---------- NOTIFICATIONS ---------- */
const NIC={document:'fa-file-lines',task:'fa-list-check',announcement:'fa-bullhorn',event:'fa-calendar-day',hours:'fa-clock',general:'fa-bell'};
function timeAgo(t){const s=(Date.now()-new Date(t).getTime())/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function renderBell(){
  const n=NOTIFS.filter(x=>!x.is_read).length;const badge=$('bell-badge');
  if(n>0){badge.textContent=n>9?'9+':n;badge.classList.remove('hidden');}else badge.classList.add('hidden');
  const list=$('bell-list');
  if(!NOTIFS.length){list.innerHTML='<div class="px-4 py-8 text-center text-gray-400 text-sm">No notifications yet.</div>';return;}
  list.innerHTML=NOTIFS.map(x=>`<button data-nid="${x.id}" class="notif-item w-full text-left flex gap-3 px-4 py-3 border-b border-gray-50 hover:bg-gray-50 transition-colors ${x.is_read?'':'bg-tnf-greenLight/40'}"><div class="w-8 h-8 rounded-lg bg-tnf-greenLight text-tnf-green grid place-items-center flex-none text-sm"><i class="fa-solid ${NIC[x.type]||NIC.general}"></i></div><div class="min-w-0 flex-1"><div class="text-sm font-semibold text-tnf-ink truncate">${esc(x.title)}</div>${x.body?`<div class="text-xs text-gray-500 line-clamp-2">${esc(x.body)}</div>`:''}<div class="text-[11px] text-gray-400 mt-0.5">${timeAgo(x.created_at)}</div></div>${x.is_read?'':'<span class="w-2 h-2 rounded-full bg-tnf-green flex-none mt-1.5"></span>'}</button>`).join('');
  list.querySelectorAll('.notif-item').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.nid;const it=NOTIFS.find(x=>x.id===id);if(it&&!it.is_read){it.is_read=true;renderBell();try{await db.from('notifications').update({is_read:true}).eq('id',id);}catch(e){}}
    if(it&&it.type==='announcement'){$('bell-panel').classList.add('hidden');route('announcements');}
    else if(it&&it.type==='event'){$('bell-panel').classList.add('hidden');route('events');}}));
}
async function loadNotifs(){try{const{data}=await db.from('notifications').select('*').eq('user_id',ME.id).order('created_at',{ascending:false}).limit(30);NOTIFS=data||[];}catch(e){NOTIFS=[];}renderBell();}
async function markAllRead(){const un=NOTIFS.filter(x=>!x.is_read).map(x=>x.id);if(!un.length)return;NOTIFS.forEach(x=>x.is_read=true);renderBell();try{await db.from('notifications').update({is_read:true}).in('id',un);}catch(e){}}
function initNotifications(){
  loadNotifs();
  $('bell-btn').addEventListener('click',e=>{e.stopPropagation();$('bell-panel').classList.toggle('hidden');$('user-menu').classList.add('hidden');});
  $('bell-readall').addEventListener('click',markAllRead);
  document.addEventListener('click',e=>{const p=$('bell-panel'),b=$('bell-btn');if(!p.classList.contains('hidden')&&!p.contains(e.target)&&!b.contains(e.target))p.classList.add('hidden');});
  try{notifChan=db.channel('notif-'+ME.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+ME.id},payload=>{NOTIFS.unshift(payload.new);if(NOTIFS.length>30)NOTIFS.pop();renderBell();}).subscribe();}catch(e){}
  setInterval(loadNotifs,45000);
}

/* ---------- HOME ---------- */
const HERO_IMG={morning:'https://images.locationscout.net/2021/02/seychelles-sunrise-seychelles.webp?h=1400&q=80',afternoon:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfT_IbDRhDEhVV_B3NzJBVSd74oltCtjU3CYhKuG0AePGyG_OYho9fBi8&s=10',evening:'https://admin.seychelles.com/sites/default/files/2024-05/305747087_6125303884164604_8640059309883641732_n.jpg',night:'https://media-cdn.tripadvisor.com/media/photo-s/04/79/22/5a/anse-soleil-beachcomber.jpg'};
const HERO_MSG={morning:['A fresh start for the islands.','Thanks for showing up today.','Small actions, big change.','The youth of Seychelles thank you.'],afternoon:['Keep the good work going.','Every hour you give counts.','You are making a difference.','Building Seychelles together.'],evening:['Winding down, finishing strong.','A good evening to you.','Reflect on what you gave today.','The islands look lovely right now.'],night:['Thanks for all you do.','Rest well when you are done.','Quiet hours, big hearts.','We appreciate you.']};
function periodNow(){const h=new Date().getHours();if(h>=5&&h<12)return{p:'morning',g:'Good morning'};if(h>=12&&h<17)return{p:'afternoon',g:'Good afternoon'};if(h>=17&&h<21)return{p:'evening',g:'Good evening'};return{p:'night',g:'Good evening'};}
function homeStat(label,id,ic){return `<div class="bg-white rounded-2xl border border-gray-100 p-4"><div class="w-9 h-9 rounded-lg bg-tnf-greenLight text-tnf-green grid place-items-center mb-2"><i class="fa-solid ${ic}"></i></div><div id="${id}" class="text-2xl font-extrabold text-tnf-ink leading-none">–</div><div class="text-gray-400 text-[11px] font-semibold mt-1">${label}</div></div>`;}
function startClock(){const upd=()=>{const d=new Date(),cl=$('home-clock'),dt=$('home-date');if(!cl)return;cl.textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});if(dt)dt.textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});};upd();window.__homeClock=setInterval(upd,20000);}
const WMO={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
async function loadWeather(){
  const set=h=>{const w=$('home-weather');if(w)w.innerHTML=h;};
  const go=async(lat,lon,label)=>{try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);const j=await r.json();const t=Math.round(j.current.temperature_2m);const desc=WMO[j.current.weather_code]||'';let loc=label;if(!loc){try{const gg=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);const gj=await gg.json();loc=gj.city||gj.locality||gj.principalSubdivision||gj.countryName||'';}catch(e){}}set(`<i class="fa-solid fa-temperature-half text-xs opacity-70"></i><span>${t}&deg;C${desc?' · '+esc(desc):''}${loc?' · '+esc(loc):''}</span>`);}catch(e){set('<i class="fa-solid fa-cloud text-xs opacity-70"></i><span>Weather unavailable</span>');}};
  if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude,null),()=>go(-4.6167,55.45,'Victoria, Seychelles'),{timeout:8000,maximumAge:600000});}
  else go(-4.6167,55.45,'Victoria, Seychelles');
}
async function renderHome(){
  const c=$('content');const{p,g}=periodNow();
  const sub=HERO_MSG[p][Math.floor(Math.random()*HERO_MSG[p].length)];
  const first=((ME.full_name||'').trim().split(/\s+/)[0])||'there';
  let deptName='';if(ME.department_id){try{const{data}=await db.from('departments').select('name').eq('id',ME.department_id).maybeSingle();if(data)deptName=data.name;}catch(e){}}
  const statusTxt=ME.is_active===false?'Inactive':'Active';
  c.innerHTML=`
    <div class="relative rounded-3xl overflow-hidden mb-6 min-h-[230px] flex items-end bg-tnf-charcoal">
      <img src="${HERO_IMG[p]}" class="absolute inset-0 w-full h-full object-cover" alt="" onerror="this.style.display='none'">
      <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/45 to-black/10"></div>
      <div class="relative p-6 md:p-8 w-full text-white">
        <div class="flex flex-wrap items-end justify-between gap-5">
          <div class="min-w-0">
            <div class="text-white/85 text-sm font-semibold mb-1">${g}</div>
            <h2 class="text-3xl md:text-4xl font-extrabold leading-tight">${esc(first)}</h2>
            <p class="text-white/85 mt-2 max-w-md text-sm md:text-base">${esc(sub)}</p>
          </div>
          <div class="text-right shrink-0">
            <div id="home-clock" class="text-3xl md:text-4xl font-extrabold tabular-nums leading-none">--:--</div>
            <div id="home-date" class="text-white/80 text-xs md:text-sm mt-1"></div>
            <div id="home-weather" class="mt-2 inline-flex items-center gap-2 bg-white/15 backdrop-blur px-3 py-1.5 rounded-full text-sm font-semibold"><i class="fa-solid fa-location-crosshairs text-xs opacity-70"></i><span>Locating…</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-5 mb-6">
      <div class="bg-white rounded-2xl border border-gray-100 p-6 flex items-center gap-4">
        ${avatarHTML(ME,'w-16 h-16 text-2xl')}
        <div class="min-w-0">
          <div class="font-bold text-tnf-ink text-lg truncate">${esc(ME.full_name||'')}</div>
          <div class="text-sm text-gray-500 truncate">${esc(roleLabel(ME.role))}${ME.title?' · '+esc(ME.title):''}</div>
          <div class="text-xs text-gray-400 mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5"><span>ID ${esc(shortId(ME.id))}</span>${deptName?`<span>${esc(deptName)}</span>`:''}<span class="inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${statusTxt==='Active'?'bg-tnf-green':'bg-gray-300'}"></span>${statusTxt}</span></div>
        </div>
      </div>
      <div class="lg:col-span-2 grid grid-cols-2 sm:grid-cols-4 gap-4">
        ${homeStat('Hours this month','h-month','fa-clock')}
        ${homeStat('Approved hours','h-total','fa-circle-check')}
        ${homeStat('Upcoming events','h-events','fa-calendar-day')}
        ${homeStat('Unread alerts','h-alerts','fa-bell')}
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-100 p-5 mb-6">
      <div class="text-sm font-bold text-tnf-ink mb-3">Quick actions</div>
      <div class="flex flex-wrap gap-2" id="home-actions"></div>
    </div>

    <div class="grid lg:grid-cols-2 gap-6">
      <div><h3 class="font-bold text-tnf-ink mb-3">Announcements</h3><div id="home-anns" class="space-y-2"><div class="text-gray-400 text-sm">Loading…</div></div></div>
      <div><h3 class="font-bold text-tnf-ink mb-3">Upcoming events</h3><div id="home-events" class="space-y-2"><div class="text-gray-400 text-sm">Loading…</div></div></div>
    </div>`;
  const qa=[['Log hours','hours','fa-clock'],['Opportunities','opportunities','fa-compass'],['Events','events','fa-calendar-day'],['My details','details','fa-id-card']];
  $('home-actions').innerHTML=qa.map(([l,k,ic])=>`<button data-k="${k}" class="qa inline-flex items-center gap-2 bg-tnf-greenLight text-tnf-greenDark hover:bg-tnf-green hover:text-white font-semibold text-sm px-4 py-2.5 rounded-lg transition-colors"><i class="fa-solid ${ic}"></i>${l}</button>`).join('');
  $('home-actions').querySelectorAll('.qa').forEach(b=>b.addEventListener('click',()=>route(b.dataset.k)));
  startClock();loadWeather();loadHomeData();
}
async function loadHomeData(){
  try{const start=new Date();start.setDate(1);const iso=start.toISOString().slice(0,10);const{data}=await db.from('volunteer_hours').select('hours,logged_on,is_approved').eq('volunteer_id',ME.id);
    const rows=data||[];const month=rows.filter(r=>r.logged_on>=iso).reduce((a,b)=>a+(parseFloat(b.hours)||0),0);const appr=rows.filter(r=>r.is_approved).reduce((a,b)=>a+(parseFloat(b.hours)||0),0);
    if($('h-month'))$('h-month').textContent=Math.round(month*10)/10||0;if($('h-total'))$('h-total').textContent=Math.round(appr*10)/10||0;
  }catch(e){}
  try{const{count}=await db.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',ME.id).eq('is_read',false);if($('h-alerts'))$('h-alerts').textContent=count||0;}catch(e){}
  try{const nowISO=new Date().toISOString();const{data}=await db.from('events').select('title,starts_at,location').eq('is_published',true).gte('starts_at',nowISO).order('starts_at',{ascending:true}).limit(5);
    if($('h-events'))$('h-events').textContent=(data||[]).length;
    const box=$('home-events');if(box){if(!data||!data.length)box.innerHTML='<div class="bg-white rounded-xl border border-gray-100 p-4 text-sm text-gray-400">No upcoming events.</div>';
      else box.innerHTML=data.slice(0,4).map(ev=>`<div class="bg-white rounded-xl border border-gray-100 p-3.5"><div class="text-tnf-green text-xs font-bold mb-0.5">${new Date(ev.starts_at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</div><div class="font-semibold text-sm text-tnf-ink">${esc(ev.title||'')}</div>${ev.location?`<div class="text-xs text-gray-400 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${esc(ev.location)}</div>`:''}</div>`).join('');}
  }catch(e){}
  try{const{data}=await db.from('announcements').select('title,body,created_at,is_pinned').order('is_pinned',{ascending:false}).order('created_at',{ascending:false}).limit(4);
    const box=$('home-anns');if(box){if(!data||!data.length)box.innerHTML='<div class="bg-white rounded-xl border border-gray-100 p-4 text-sm text-gray-400">No announcements yet.</div>';
      else box.innerHTML=data.map(a=>`<div class="bg-white rounded-xl border border-gray-100 p-3.5"><div class="flex items-center gap-2 mb-0.5">${a.is_pinned?'<i class="fa-solid fa-thumbtack text-tnf-green text-xs"></i>':''}<div class="font-semibold text-sm text-tnf-ink">${esc(a.title||'')}</div></div>${a.body?`<div class="text-xs text-gray-500 line-clamp-2">${esc(a.body)}</div>`:''}</div>`).join('');}
  }catch(e){}

/* ---------- MY HOURS ---------- */
async function renderHours(){
  const c=$('content');
  c.innerHTML=`
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl border border-gray-100 p-6">
          <h3 class="font-bold text-tnf-ink mb-4">Log hours</h3>
          <label class="block text-sm font-semibold text-tnf-ink mb-1.5">Activity</label>
          <input id="vh-act" placeholder="e.g. Beach clean-up" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 mb-3">
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div><label class="block text-sm font-semibold text-tnf-ink mb-1.5">Hours</label><input id="vh-hrs" type="number" step="0.5" min="0" placeholder="0" class="w-full border border-gray-200 rounded-lg px-3 py-2.5"></div>
            <div><label class="block text-sm font-semibold text-tnf-ink mb-1.5">Date</label><input id="vh-date" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2.5"></div>
          </div>
          <button id="vh-save" class="w-full bg-tnf-green hover:bg-tnf-greenDark text-white font-bold py-2.5 rounded-lg text-sm">Add hours</button>
          <p id="vh-msg" class="text-sm font-semibold mt-2 min-h-[1em]"></p>
          <p class="text-xs text-gray-400 mt-2">Hours are reviewed by the Foundation before they count as approved.</p>
        </div>
      </div>
      <div class="lg:col-span-2">
        <div class="flex items-center gap-4 mb-4">
          <div class="bg-white rounded-2xl border border-gray-100 px-5 py-4 flex-1"><div class="text-2xl font-extrabold text-tnf-ink" id="vh-sum-appr">–</div><div class="text-xs text-gray-400 font-semibold">Approved hours</div></div>
          <div class="bg-white rounded-2xl border border-gray-100 px-5 py-4 flex-1"><div class="text-2xl font-extrabold text-tnf-ink" id="vh-sum-pend">–</div><div class="text-xs text-gray-400 font-semibold">Awaiting review</div></div>
        </div>
        <div id="vh-list"><div class="text-gray-400 text-sm py-8 text-center">Loading…</div></div>
      </div>
    </div>`;
  $('vh-date').value=new Date().toISOString().slice(0,10);
  const load=async()=>{
    let rows=[];try{const{data}=await db.from('volunteer_hours').select('*').eq('volunteer_id',ME.id).order('logged_on',{ascending:false});rows=data||[];}catch(e){}
    const appr=rows.filter(r=>r.is_approved).reduce((a,b)=>a+(parseFloat(b.hours)||0),0);
    const pend=rows.filter(r=>!r.is_approved).reduce((a,b)=>a+(parseFloat(b.hours)||0),0);
    $('vh-sum-appr').textContent=Math.round(appr*10)/10||0;$('vh-sum-pend').textContent=Math.round(pend*10)/10||0;
    const box=$('vh-list');
    if(!rows.length){box.innerHTML='<div class="bg-white rounded-2xl border border-gray-100 p-8 text-center text-gray-400 text-sm">No hours logged yet. Add your first above.</div>';return;}
    box.innerHTML=`<div class="bg-white rounded-2xl border border-gray-100 divide-y divide-gray-100">${rows.map(r=>`<div class="flex items-center gap-4 p-4"><div class="w-10 h-10 rounded-lg bg-tnf-greenLight text-tnf-green grid place-items-center flex-none"><i class="fa-solid fa-clock"></i></div><div class="flex-1 min-w-0"><div class="font-semibold text-tnf-ink truncate">${esc(r.activity||'Volunteering')}</div><div class="text-xs text-gray-400">${new Date(r.logged_on).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div></div><div class="text-right"><div class="font-bold text-tnf-ink">${parseFloat(r.hours)||0}h</div><div class="text-[11px] font-semibold ${r.is_approved?'text-tnf-greenDark':'text-gray-400'}">${r.is_approved?'Approved':'Pending'}</div></div></div>`).join('')}</div>`;
  };
  $('vh-save').addEventListener('click',async()=>{
    const msg=$('vh-msg'),btn=$('vh-save');const activity=$('vh-act').value.trim();const hours=parseFloat($('vh-hrs').value);const logged_on=$('vh-date').value;
    if(!activity||!hours||hours<=0){msg.className='text-sm font-semibold mt-2 text-red-600';msg.textContent='Add an activity and a number of hours.';return;}
    btn.disabled=true;btn.textContent='Saving…';msg.textContent='';
    try{const{error}=await db.from('volunteer_hours').insert({volunteer_id:ME.id,activity,hours,logged_on});if(error)throw error;$('vh-act').value='';$('vh-hrs').value='';msg.className='text-sm font-semibold mt-2 text-tnf-greenDark';msg.textContent='Hours added.';load();}
    catch(e){msg.className='text-sm font-semibold mt-2 text-red-600';msg.textContent='Could not save: '+(e.message||'error');}
    btn.disabled=false;btn.textContent='Add hours';
  });
  load();
}

    catch(e){b.disabled=false;b.textContent=old;toast(e.message||'Could not RSVP',false);}

/* ---------- INIT ---------- */
async function init(){
  db=supabase.createClient(SB_URL,SB_KEY);
  const{data:{session}}=await db.auth.getSession();
  if(!session){location.replace('/login');return;}
  let prof=null;
  try{const{data}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();prof=data;}catch(e){}
  if(!prof){ $('gate-text').textContent='Setting up your account… please contact the Foundation if this persists.'; return; }
  if(prof.is_active===false){ await db.auth.signOut(); location.replace('/login'); return; }
  ME=prof;
  const nm=prof.full_name||prof.email||'You';
  $('u-name').textContent=nm;$('u-role').textContent=roleLabel(prof.role);
  const av=$('u-avatar');if(prof.avatar_url){av.innerHTML=`<img src="${esc(prof.avatar_url)}" class="w-full h-full object-cover" alt="">`;av.classList.remove('bg-tnf-green');}else av.textContent=(nm.trim()[0]||'?').toUpperCase();
  $('um-name').textContent=nm;$('um-email').textContent=prof.email||'';
  if(['staff','board','admin','superadmin'].includes(prof.role))$('staff-banner').classList.remove('hidden');
  buildNav();route('home');initNotifications();
  $('gate').classList.add('hidden');$('app').classList.remove('hidden');
  $('signout').addEventListener('click',async()=>{await db.auth.signOut();location.replace('/login');});
  $('menu-btn').addEventListener('click',openDrawer);
  $('drawer-close').addEventListener('click',closeDrawer);
  $('backdrop').addEventListener('click',closeDrawer);
  $('home-link').addEventListener('click',e=>{e.preventDefault();route('home');});
  $('user-btn').addEventListener('click',e=>{e.stopPropagation();$('user-menu').classList.toggle('hidden');});
  $('um-home').addEventListener('click',()=>route('home'));
  document.addEventListener('click',e=>{const m=$('user-menu'),b=$('user-btn');if(m&&!m.classList.contains('hidden')&&!m.contains(e.target)&&!b.contains(e.target))m.classList.add('hidden');});
}
window.addEventListener('DOMContentLoaded',()=>{ if(window.supabase){init();} else { const s=document.querySelector('script[src*="supabase-js"]'); s&&s.addEventListener('load',init); } });
</script>
