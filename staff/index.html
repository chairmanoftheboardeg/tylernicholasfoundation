function formatValue(field,val,pubcfg){

async function saveForm(key,res,rec,editing){
  const btn=$('fsave'); btn.disabled=true; const old=btn.innerHTML; btn.innerHTML='<span class="btn-spin"></span> Saving…';
  const payload={};
  try{
    for(const f of res.fields){
      if(f.t==='bool'){payload[f.k]=document.getElementById('f_'+f.k).dataset.val==='1';continue;}
      if(f.t==='social'){const o={};SOCIALS.forEach(p=>{const val=document.getElementById(`f_${f.k}__${p}`).value.trim();if(val)o[p]=val;});payload[f.k]=o;continue;}
      if(f.t==='rich'){payload[f.k]=document.getElementById('f_'+f.k).innerHTML.trim()||null;continue;}
      const el=document.getElementById('f_'+f.k); if(!el)continue; let val=el.value;
      if(f.t==='tags'){payload[f.k]=val.split(',').map(s=>s.trim()).filter(Boolean);continue;}
      if(f.t==='number'){payload[f.k]=val===''?null:Number(val);continue;}
      if(f.t==='datetime'){payload[f.k]=fromLocalInput(val);continue;}
      if(f.t==='date'){payload[f.k]=val||null;continue;}
      if(f.t==='ref'){payload[f.k]=val||null;continue;}
      val=(val||'').trim();
      if(f.t==='slug'){val=val?slugify(val):slugify(payload[res.fields[0].k]||'');}
      payload[f.k]=val===''?null:val;
    }
    if(res.stampMe&&!editing)payload[res.stampMe]=ME.id;
    for(const f of res.fields){ if(f.req&&(payload[f.k]==null||payload[f.k]==='')){toast('Please fill in: '+(f.label||f.k),false);btn.disabled=false;btn.innerHTML=old;return;} }
    let error;
    if(editing){ ({error}=await db.from(res.table).update(payload).eq('id',rec.id)); }
    else { ({error}=await db.from(res.table).insert(payload)); }
    if(error)throw error;
    toast(editing?'Saved':'Created'); REFCACHE={};REFMAP={}; renderList(key,res);
  }catch(e){ toast(e.message||'Save failed',false); btn.disabled=false; btn.innerHTML=old; }
}

async function renderInbox(k,cfg){
  const c=$('content');
  if(cfg.sensitive) c.innerHTML=`<div class="bg-red-50 border border-red-100 rounded-xl p-4 text-sm text-red-700 mb-5"><i class="fa-solid fa-lock mr-1.5"></i>Confidential. Handle these reports with care and in line with our safeguarding policy.</div><div id="ibody"><div class="loader-spinner my-10"></div></div>`;
  else c.innerHTML=`<div id="ibody"><div class="loader-spinner my-10"></div></div>`;
  let rows=[];
  try{ const{data,error}=await db.from(cfg.table).select('*').order('created_at',{ascending:false}); if(error)throw error; rows=data||[]; }
  catch(e){ $('ibody').innerHTML=`<p class="text-gray-400 text-sm italic">Nothing to show, or you don't have access to these.</p>`; return; }
  if(!rows.length){ $('ibody').innerHTML=`<div class="bg-white rounded-2xl border border-gray-100 p-10 text-center text-gray-400">No entries yet.</div>`; return; }
  const hide=['id','event_id','job_id','reviewed_by','author_id','updated_at','search_vector'];
  $('ibody').innerHTML=`<p class="text-gray-400 text-sm mb-4">${rows.length} ${rows.length===1?'entry':'entries'}</p><div class="space-y-3">${rows.map(r=>{
    const fields=Object.keys(r).filter(kk=>!hide.includes(kk)&&r[kk]!=null&&r[kk]!==''&&!(Array.isArray(r[kk])&&!r[kk].length));
    const created=r.created_at?fmtDateTime(r.created_at):'';
    return `<div class="bg-white rounded-2xl border border-gray-100 p-5"><div class="flex justify-between items-start mb-2"><div class="font-bold text-tnf-ink">${esc(r.name||r.title||r.subject||r.email||r.donor_name||'Entry')}</div><div class="text-xs text-gray-400 whitespace-nowrap ml-3">${created}</div></div><div class="space-y-1.5 text-sm">${fields.filter(kk=>kk!=='created_at'&&kk!=='name'&&kk!=='title').map(kk=>{let val=r[kk];if(Array.isArray(val))val=val.join(', ');if(typeof val==='string'&&/^\d{4}-\d\d-\d\dT/.test(val))val=fmtDateTime(val);return `<div><span class="text-gray-400 font-semibold">${esc(kk.replace(/_/g,' '))}:</span> <span class="text-gray-700">${esc(val)}</span></div>`;}).join('')}</div></div>`;
  }).join('')}</div>`;
}

async function renderUsers(){
  const c=$('content');
  c.innerHTML=`<p class="text-gray-500 mb-6">Manage who has access and what they can do. Only administrators can change roles and permissions.</p><div id="ubody"><div class="loader-spinner my-10"></div></div>`;
  let rows=[];
  try{const{data,error}=await db.from('profiles').select('*').order('created_at',{ascending:true});if(error)throw error;rows=data||[];}
  catch(e){$('ubody').innerHTML=`<p class="text-red-600 text-sm">${esc(e.message)}</p>`;return;}
  $('ubody').innerHTML=`<div class="bg-white rounded-2xl border border-gray-100 divide-y divide-gray-100">${rows.map(u=>`<div class="flex items-center gap-4 p-4"><div class="w-10 h-10 rounded-full bg-tnf-greenLight text-tnf-greenDark grid place-items-center font-bold flex-none">${esc((u.full_name||u.email||'?').trim()[0].toUpperCase())}</div><div class="flex-1 min-w-0"><div class="font-semibold text-tnf-ink truncate">${esc(u.full_name||'(no name)')} ${u.id===ME.id?'<span class=\"text-xs text-gray-400\">(you)</span>':''}</div><div class="text-xs text-gray-400 truncate">${esc(u.email||'')}</div></div><span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${['admin','superadmin'].includes(u.role)?'bg-tnf-greenLight text-tnf-greenDark':'bg-gray-100 text-gray-500'}">${esc((ROLES.find(r=>r[0]===u.role)||[])[1]||u.role)}</span>${u.is_active===false?'<span class=\"text-[11px] font-bold px-2 py-1 rounded-full bg-red-50 text-red-600\">Inactive</span>':''}<button class="uedit text-gray-400 hover:text-tnf-green px-2" data-id="${u.id}"><i class="fa-solid fa-pen"></i></button></div>`).join('')}</div>`;
  $('ubody').querySelectorAll('.uedit').forEach(b=>b.onclick=()=>editUser(rows.find(x=>x.id===b.dataset.id)));
}
async function editUser(u){
  await loadRef('departments');
  const c=$('content'); $('page-title').textContent='Edit user';
  c.innerHTML=`<button id="uback" class="text-sm font-bold text-tnf-green mb-5"><i class="fa-solid fa-arrow-left mr-2"></i>Back to users</button>
  <form id="uform" class="bg-white rounded-2xl border border-gray-100 p-6 md:p-8 space-y-6 max-w-2xl">
    <div><div class="font-bold text-tnf-ink text-lg">${esc(u.full_name||'(no name)')}</div><div class="text-gray-400 text-sm">${esc(u.email||'')}</div></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-2">Role</label><select id="u_role" class="w-full border border-gray-200 rounded-xl px-4 py-3 bg-white">${ROLES.map(r=>`<option value="${r[0]}" ${u.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-2">Title (job title)</label><input id="u_title" value="${esc(u.title||'')}" class="w-full border border-gray-200 rounded-xl px-4 py-3"/></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-2">Department</label><select id="u_dept" class="w-full border border-gray-200 rounded-xl px-4 py-3 bg-white"><option value="">— none —</option>${(REFCACHE['departments']||[]).map(d=>`<option value="${d.id}" ${u.department_id===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-3">Permissions <span class="text-gray-400 font-normal">· what they can manage</span></label><div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${PERM_TAGS.map(t=>`<label class="flex items-center gap-2 text-sm border border-gray-200 rounded-lg px-3 py-2 cursor-pointer"><input type="checkbox" value="${t}" class="uperm accent-tnf-green" ${(u.permissions||[]).includes(t)?'checked':''}/> ${t}</label>`).join('')}</div><p class="text-xs text-gray-400 mt-2">Administrators have every permission automatically.</p></div>
    <div class="flex items-center justify-between gap-4"><label class="text-sm font-semibold text-tnf-ink">Account active</label><div class="toggle ${u.is_active!==false?'on':''}" id="u_active" data-val="${u.is_active!==false?1:0}"><span></span></div></div>
    <div class="flex items-center gap-3 pt-4 border-t border-gray-100"><button type="submit" id="usave" class="bg-tnf-green hover:bg-tnf-greenDark text-white font-bold px-7 py-3 rounded-xl">Save user</button><button type="button" id="ucancel" class="text-gray-500 font-semibold px-4">Cancel</button></div>
  </form>`;
  $('uback').onclick=renderUsers; $('ucancel').onclick=renderUsers;
  $('u_active').onclick=()=>{const t=$('u_active');const on=t.dataset.val==='1';t.dataset.val=on?'0':'1';t.classList.toggle('on',!on);};
  $('uform').addEventListener('submit',async e=>{e.preventDefault();const btn=$('usave');btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="btn-spin"></span> Saving…';
    const payload={role:$('u_role').value,title:$('u_title').value.trim()||null,department_id:$('u_dept').value||null,permissions:[...document.querySelectorAll('.uperm:checked')].map(x=>x.value),is_active:$('u_active').dataset.val==='1'};
    try{const{error}=await db.from('profiles').update(payload).eq('id',u.id);if(error)throw error;toast('User updated');renderUsers();}catch(err){toast(err.message||'Failed',false);btn.disabled=false;btn.innerHTML=old;}
  });
}

async function renderSettings(){
  const c=$('content');
  c.innerHTML=`<div id="sbody"><div class="loader-spinner my-10"></div></div>`;
  let s={};
  try{const{data}=await db.from('site_settings').select('*').maybeSingle();s=data||{id:true};}catch(e){s={id:true};}
  const social=s.social_links||{};
  const inp=(id,val,ph='')=>`<input id="${id}" value="${esc(val||'')}" placeholder="${ph}" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:border-tnf-green focus:ring-4 focus:ring-tnf-green/10"/>`;
  const ta=(id,val)=>`<textarea id="${id}" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 resize-y focus:border-tnf-green focus:ring-4 focus:ring-tnf-green/10">${esc(val||'')}</textarea>`;
  const card=(title,inner)=>`<div class="bg-white rounded-2xl border border-gray-100 p-6 md:p-8 space-y-5"><h3 class="font-bold text-tnf-ink">${title}</h3>${inner}</div>`;
  const fld=(l,el)=>`<div><label class="block text-sm font-semibold text-tnf-ink mb-2">${l}</label>${el}</div>`;
  $('sbody').innerHTML=`<div class="space-y-6 max-w-3xl">
    ${card('Homepage hero',fld('Headline',inp('s_hero_headline',s.hero_headline))+fld('Sub-headline',ta('s_hero_subheadline',s.hero_subheadline)))}
    ${card('Mission & vision',fld('Mission heading',inp('s_mission_heading',s.mission_heading))+fld('Mission text',ta('s_mission_text',s.mission_text))+fld('Vision text',ta('s_vision_text',s.vision_text)))}
    ${card('About',fld('About heading',inp('s_about_heading',s.about_heading))+fld('About body',ta('s_about_body',s.about_body)))}
    ${card('Founder',fld('Name',inp('s_founder_name',s.founder_name))+fld('Role',inp('s_founder_role',s.founder_role))+fld('Message',ta('s_founder_message',s.founder_message))+fld('Portrait image URL',inp('s_founder_image',s.founder_image)))}
    ${card('Announcement bar',`<div class="flex items-center justify-between gap-4"><label class="text-sm font-semibold text-tnf-ink">Show announcement bar</label><div class="toggle ${s.announcement_active?'on':''}" id="s_announcement_active" data-val="${s.announcement_active?1:0}"><span></span></div></div>`+fld('Text',inp('s_announcement_text',s.announcement_text))+fld('Link (optional)',inp('s_announcement_url',s.announcement_url)))}
    ${card('Contact',fld('Email',inp('s_contact_email',s.contact_email))+fld('Phone',inp('s_contact_phone',s.contact_phone))+fld('Address',ta('s_contact_address',s.contact_address))+fld('Office hours',inp('s_office_hours',s.office_hours)))}
    ${card('Social links',`<div class="grid grid-cols-2 gap-3">${SOCIALS.map(p=>fld(p.charAt(0).toUpperCase()+p.slice(1),inp('soc_'+p,social[p]))).join('')}</div>`)}
    ${card('SEO',fld('Title',inp('s_seo_title',s.seo_title))+fld('Description',ta('s_seo_description',s.seo_description))+fld('Share image URL',inp('s_seo_image',s.seo_image)))}
    <div class="flex items-center gap-3"><button id="ssave" class="bg-tnf-green hover:bg-tnf-greenDark text-white font-bold px-7 py-3 rounded-xl">Save settings</button></div>
  </div>`;
  $('s_announcement_active').onclick=()=>{const t=$('s_announcement_active');const on=t.dataset.val==='1';t.dataset.val=on?'0':'1';t.classList.toggle('on',!on);};
  $('ssave').onclick=async()=>{const btn=$('ssave');btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="btn-spin"></span> Saving…';
    const g=id=>{const e=document.getElementById(id);return e?(e.value.trim()||null):null;};
    const soc={};SOCIALS.forEach(p=>{const v=g('soc_'+p);if(v)soc[p]=v;});
    const payload={id:true,hero_headline:g('s_hero_headline'),hero_subheadline:g('s_hero_subheadline'),mission_heading:g('s_mission_heading'),mission_text:g('s_mission_text'),vision_text:g('s_vision_text'),about_heading:g('s_about_heading'),about_body:g('s_about_body'),founder_name:g('s_founder_name'),founder_role:g('s_founder_role'),founder_message:g('s_founder_message'),founder_image:g('s_founder_image'),announcement_active:$('s_announcement_active').dataset.val==='1',announcement_text:g('s_announcement_text'),announcement_url:g('s_announcement_url'),contact_email:g('s_contact_email'),contact_phone:g('s_contact_phone'),contact_address:g('s_contact_address'),office_hours:g('s_office_hours'),social_links:soc,seo_title:g('s_seo_title'),seo_description:g('s_seo_description'),seo_image:g('s_seo_image')};
    try{const{error}=await db.from('site_settings').upsert(payload,{onConflict:'id'});if(error)throw error;toast('Settings saved');}catch(e){toast(e.message||'Failed',false);}
    btn.disabled=false;btn.innerHTML=old;
  };
}

/* ================= TEAM CHAT ================= */
let CHAT={channel:null,channels:[],open:false};
function chatLayout(showMain){const wide=window.innerWidth>=640;const list=$('ch-list'),main=$('ch-main');if(!list||!main)return;if(wide){list.style.display='flex';main.style.display='flex';}else{list.style.display=showMain?'none':'flex';main.style.display=showMain?'flex':'none';}}
async function renderChat(){
  $('new-btn').classList.add('hidden');
  const c=$('content'); c.classList.remove('max-w-6xl'); c.classList.add('max-w-none');
  c.innerHTML=`<div class="flex gap-4" style="height:calc(100vh - 9rem)">
    <div id="ch-list" class="w-full sm:w-72 flex-none bg-white rounded-2xl border border-gray-100 flex flex-col overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between"><span class="font-bold text-tnf-ink text-sm">Channels</span><button id="ch-new" class="w-7 h-7 rounded-lg bg-tnf-greenLight text-tnf-green hover:bg-tnf-green hover:text-white transition-colors"><i class="fa-solid fa-plus text-xs"></i></button></div>
      <div id="ch-channels" class="flex-1 overflow-y-auto p-2 space-y-1"><div class="loader-spinner my-8 mx-auto"></div></div>
    </div>
    <div id="ch-main" class="hidden sm:flex flex-1 min-w-0 bg-white rounded-2xl border border-gray-100 flex-col overflow-hidden">
      <div class="flex-1 grid place-items-center text-gray-400 text-sm">Select a channel to start chatting</div>
    </div>
  </div>`;
  $('ch-new').onclick=newChannel;
  CHAT.open=false; window.onresize=()=>chatLayout(CHAT.open); chatLayout(false);
  await loadChannels();
}
async function loadChannels(){
  try{const{data,error}=await db.from('chat_channels').select('*').order('created_at',{ascending:true});if(error)throw error;CHAT.channels=data||[];}
  catch(e){$('ch-channels').innerHTML=`<p class="text-gray-400 text-xs p-3">Couldn't load channels.</p>`;return;}
  if(!CHAT.channels.length){$('ch-channels').innerHTML=`<div class="p-4 text-center text-gray-400 text-sm">No channels yet.${isAdmin?' Create one with +':''}</div>`;return;}
  $('ch-channels').innerHTML=CHAT.channels.map(ch=>`<button class="ch-item w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-50 flex items-center gap-2 ${CHAT.channel&&CHAT.channel.id===ch.id?'bg-tnf-greenLight':''}" data-id="${ch.id}"><i class="fa-solid ${ch.type==='dm'?'fa-user':'fa-hashtag'} text-gray-400 text-xs"></i><span class="font-semibold text-sm text-tnf-ink truncate">${esc(ch.name)}</span></button>`).join('');
  $('ch-channels').querySelectorAll('.ch-item').forEach(b=>b.onclick=()=>openChannel(CHAT.channels.find(x=>x.id===b.dataset.id)));
}
async function newChannel(){
  const name=prompt('Channel name:'); if(!name||!name.trim())return;
  try{const{data,error}=await db.from('chat_channels').insert({name:name.trim(),type:'channel',is_private:true,created_by:ME.id}).select().maybeSingle();if(error)throw error;
    try{await db.from('chat_channel_members').insert({channel_id:data.id,profile_id:ME.id,role:'owner'});}catch(_){}
    toast('Channel created'); await loadChannels(); if(data)openChannel(data);
  }catch(e){toast(e.message||'Could not create channel',false);}
}
function openChannel(ch){
  if(!ch)return; CHAT.channel=ch;
  if(window.__chatPoll){clearInterval(window.__chatPoll);window.__chatPoll=null;}
  CHAT.open=true; chatLayout(true); const main=$('ch-main');
  main.innerHTML=`<div class="px-4 py-3 border-b border-gray-100 flex items-center gap-3">
      <button id="ch-back" class="sm:hidden text-gray-400"><i class="fa-solid fa-arrow-left"></i></button>
      <i class="fa-solid fa-hashtag text-gray-400 text-sm"></i><span class="font-bold text-tnf-ink truncate flex-1">${esc(ch.name)}</span>
      ${isAdmin?`<button id="ch-add" class="text-xs font-semibold text-tnf-green hover:text-tnf-greenDark"><i class="fa-solid fa-user-plus mr-1"></i>Add people</button>`:''}
    </div>
    <div id="ch-messages" class="flex-1 overflow-y-auto p-4 space-y-3"><div class="loader-spinner my-8 mx-auto"></div></div>
    <div id="ch-add-panel" class="hidden border-t border-gray-100 p-3 max-h-48 overflow-y-auto"></div>
    <form id="ch-form" class="border-t border-gray-100 p-3 flex items-center gap-2">
      <input id="ch-input" autocomplete="off" placeholder="Write a message…" class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 focus:border-tnf-green focus:ring-4 focus:ring-tnf-green/10"/>
      <button type="submit" class="bg-tnf-green hover:bg-tnf-greenDark text-white w-10 h-10 rounded-xl flex-none"><i class="fa-solid fa-paper-plane"></i></button>
    </form>`;
  const back=$('ch-back'); if(back)back.onclick=()=>{CHAT.open=false;chatLayout(false);if(window.__chatPoll){clearInterval(window.__chatPoll);window.__chatPoll=null;}};
  const add=$('ch-add'); if(add)add.onclick=toggleAddPeople;
  $('ch-form').onsubmit=sendMessage;
  loadMessages(true);
  window.__chatPoll=setInterval(()=>loadMessages(false),4000);
  // reflect active state in list
  document.querySelectorAll('.ch-item').forEach(b=>b.classList.toggle('bg-tnf-greenLight',b.dataset.id===ch.id));
}
async function loadMessages(scroll){
  if(!CHAT.channel)return; const box=$('ch-messages'); if(!box)return;
  let msgs=[];
  try{const{data,error}=await db.from('chat_messages').select('*').eq('channel_id',CHAT.channel.id).order('created_at',{ascending:true}).limit(200);if(error)throw error;msgs=data||[];}
  catch(e){box.innerHTML=`<p class="text-gray-400 text-sm text-center">Couldn't load messages.</p>`;return;}
  if(!msgs.length){box.innerHTML=`<div class="text-center text-gray-400 text-sm py-8">No messages yet — say hello 👋</div>`;return;}
  const ids=[...new Set(msgs.map(m=>m.sender_id))]; await loadRef('profiles');
  const nameOf=id=>(REFMAP.profiles&&REFMAP.profiles[id])||'Someone';
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=msgs.map(m=>{const mine=m.sender_id===ME.id;const nm=nameOf(m.sender_id);
    return `<div class="flex ${mine?'justify-end':'justify-start'}"><div class="max-w-[75%]">${mine?'':`<div class="text-[11px] font-bold text-gray-400 mb-0.5 ml-1">${esc(nm)}</div>`}<div class="rounded-2xl px-4 py-2 ${mine?'bg-tnf-green text-white rounded-br-sm':'bg-gray-100 text-gray-800 rounded-bl-sm'}"><div class="text-sm whitespace-pre-wrap break-words">${esc(m.body||'')}</div></div><div class="text-[10px] text-gray-400 mt-0.5 ${mine?'text-right mr-1':'ml-1'}">${fmtTime(m.created_at)}</div></div></div>`;
  }).join('');
  if(scroll||atBottom)box.scrollTop=box.scrollHeight;
}
async function sendMessage(e){
  e.preventDefault(); const inp=$('ch-input'); const body=inp.value.trim(); if(!body||!CHAT.channel)return;
  inp.value='';
  try{const{error}=await db.from('chat_messages').insert({channel_id:CHAT.channel.id,sender_id:ME.id,body});if(error)throw error;await loadMessages(true);}
  catch(err){toast(err.message||'Message not sent',false);inp.value=body;}
}
async function toggleAddPeople(){
  const panel=$('ch-add-panel'); if(!panel)return;
  if(!panel.classList.contains('hidden')){panel.classList.add('hidden');return;}
  panel.classList.remove('hidden'); panel.innerHTML='<div class="loader-spinner my-4 mx-auto"></div>';
  let staff=[],members=[];
  try{const{data}=await db.from('profiles').select('id,full_name,email,role').in('role',['staff','board','admin','superadmin']).order('full_name');staff=data||[];}catch(e){}
  try{const{data}=await db.from('chat_channel_members').select('profile_id').eq('channel_id',CHAT.channel.id);members=(data||[]).map(m=>m.profile_id);}catch(e){}
  const avail=staff.filter(s=>!members.includes(s.id));
  if(!avail.length){panel.innerHTML='<p class="text-xs text-gray-400 p-2">Everyone is already in this channel.</p>';return;}
  panel.innerHTML=avail.map(s=>`<div class="flex items-center justify-between gap-2 py-1.5"><span class="text-sm text-tnf-ink truncate">${esc(s.full_name||s.email)}</span><button class="addp text-xs font-bold text-tnf-green hover:text-tnf-greenDark" data-id="${s.id}">Add</button></div>`).join('');
  panel.querySelectorAll('.addp').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='…';try{const{error}=await db.from('chat_channel_members').insert({channel_id:CHAT.channel.id,profile_id:b.dataset.id});if(error)throw error;b.textContent='Added ✓';b.classList.add('text-gray-400');}catch(e){toast(e.message||'Could not add',false);b.disabled=false;b.textContent='Add';}});
}
</script>
