<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Portal | Tyler Nicholas Foundation</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="https://i.ibb.co/BKLps0Qx/TNF-LOGO.jpg" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{tnf:{green:'#2E9E44',greenDark:'#26863A',greenLight:'#EEF7EF',ink:'#152219',charcoal:'#0E1A13'}}}}}
</script>
<style>
    html{overflow-x:hidden}body{overflow-x:clip}
  body{background:#f1f5f4}
  .loader-spinner{border:3px solid rgba(46,158,68,.2);border-left-color:#2E9E44;border-radius:50%;width:44px;height:44px;animation:spin .9s linear infinite}
  .btn-spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .nav-item.active{background:rgba(46,158,68,.16);color:#fff}
  .nav-item.active i{color:#2E9E44}
  input:focus,textarea:focus,select:focus{outline:none}
  .rt-toolbar button{width:32px;height:32px;border-radius:6px}
  .rt-toolbar button:hover{background:#eef2ee}
  .rt[contenteditable]:empty:before{content:attr(data-ph);color:#9ca3af}
  .rt{min-height:180px}.rt h2{font-size:1.35rem;font-weight:700;margin:.6rem 0 .3rem}.rt h3{font-size:1.15rem;font-weight:700;margin:.5rem 0 .3rem}.rt ul{list-style:disc;padding-left:1.4rem}.rt ol{list-style:decimal;padding-left:1.4rem}.rt a{color:#2E9E44;text-decoration:underline}.rt p{margin-bottom:.6rem}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}
  .toggle{width:44px;height:24px;border-radius:999px;background:#d1d5db;position:relative;transition:.2s;cursor:pointer;flex:none}
  .toggle.on{background:#2E9E44}.toggle span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.toggle.on span{left:22px}
</style>
</head>
<body class="font-sans text-gray-900">

<div id="gate" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
  <div class="text-center"><div class="loader-spinner mx-auto mb-4"></div><p id="gate-text" class="text-gray-500 font-semibold text-sm">Checking your access…</p></div>
</div>

<div id="app" class="hidden min-h-screen flex flex-col">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-2">
      <a href="#" id="home-link" class="flex items-center gap-2.5 shrink-0 mr-1">
        <img src="https://i.ibb.co/BKLps0Qx/TNF-LOGO.jpg" class="h-9 w-9 rounded-lg bg-white object-contain" alt="TNF" />
        <div class="leading-tight hidden sm:block"><div class="font-extrabold text-sm text-tnf-ink">Foundation</div><div class="text-tnf-green text-[11px] font-bold">Staff</div></div>
      </a>
      <nav id="nav" class="hidden lg:flex items-center gap-0.5 flex-1 text-sm font-semibold"></nav>
      <div class="flex items-center gap-1 ml-auto shrink-0">
        <div class="relative">
          <button id="bell-btn" class="relative w-10 h-10 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-tnf-ink transition-colors" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span id="bell-badge" class="hidden absolute top-1 right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold grid place-items-center"></span></button>
          <div id="bell-panel" class="hidden absolute right-0 mt-2 w-80 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 z-40 overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100"><span class="font-bold text-tnf-ink text-sm">Notifications</span><button id="bell-readall" class="text-xs font-semibold text-tnf-green hover:text-tnf-greenDark">Mark all read</button></div>
            <div id="bell-list" class="max-h-96 overflow-y-auto"></div>
          </div>
        </div>
        <div class="relative">
          <button id="user-btn" class="flex items-center gap-2 pl-1 pr-1.5 py-1 rounded-lg hover:bg-gray-100 transition-colors">
            <span id="u-avatar" class="w-9 h-9 rounded-full bg-tnf-green grid place-items-center font-bold text-sm text-white flex-none overflow-hidden"></span>
            <span class="hidden md:block text-left leading-tight"><span id="u-name" class="block font-semibold text-sm text-tnf-ink truncate max-w-[150px]"></span><span id="u-role" class="block text-gray-400 text-xs"></span></span>
            <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 hidden md:block"></i>
          </button>
          <div id="user-menu" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-gray-100 z-40 overflow-hidden py-1.5">
            <div class="px-4 py-3 border-b border-gray-100"><div id="um-name" class="font-bold text-tnf-ink text-sm truncate"></div><div id="um-email" class="text-gray-400 text-xs truncate"></div></div>
            <button id="um-home" class="w-full text-left px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700 flex items-center gap-3"><i class="fa-solid fa-house w-4 text-tnf-green"></i>Home</button>
            <a href="/" class="px-4 py-2.5 hover:bg-gray-50 text-sm text-gray-700 flex items-center gap-3"><i class="fa-solid fa-arrow-up-right-from-square w-4 text-tnf-green"></i>View public site</a>
            <button id="signout" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-sm text-red-600 flex items-center gap-3"><i class="fa-solid fa-right-from-bracket w-4"></i>Sign out</button>
          </div>
        </div>
        <button id="menu-btn" class="lg:hidden w-10 h-10 rounded-lg hover:bg-gray-100 text-tnf-ink text-xl"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <div id="backdrop" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
  <div id="mobile-drawer" class="fixed top-0 right-0 bottom-0 w-80 max-w-[85vw] bg-white z-50 shadow-2xl translate-x-full transition-transform overflow-y-auto">
    <div class="flex items-center justify-between px-5 h-16 border-b border-gray-100"><span class="font-extrabold text-tnf-ink">Menu</span><button id="drawer-close" class="w-9 h-9 text-gray-500 text-2xl leading-none">&times;</button></div>
    <nav id="mobile-nav" class="p-3 pb-10"></nav>
  </div>

  <div id="subbar" class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
      <h1 id="page-title" class="text-lg font-bold text-tnf-ink flex-1">Home</h1>
      <button id="new-btn" class="hidden bg-tnf-green hover:bg-tnf-greenDark text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors"><i class="fa-solid fa-plus mr-1.5"></i>New</button>
    </div>
  </div>

  <main class="flex-1">
    <div id="content" class="max-w-7xl mx-auto px-4 py-6"></div>
  </main>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-[60] space-y-2"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const slugify=s=>(s||'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,80);
const fmtDate=v=>v?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(v)):'';
const fmtDateTime=v=>v?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v)):'';
const fmtTime=v=>v?new Intl.DateTimeFormat('en-GB',{hour:'numeric',minute:'2-digit'}).format(new Date(v)):'';
function toast(msg,ok=true){const t=document.createElement('div');t.className=`px-4 py-3 rounded-xl shadow-lg text-sm font-semibold text-white ${ok?'bg-tnf-green':'bg-red-600'}`;t.textContent=msg;$('toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2600);}
function toLocalInput(iso){if(!iso)return'';const d=new Date(iso);const l=new Date(d.getTime()-d.getTimezoneOffset()*60000);return l.toISOString().slice(0,16);}
const fromLocalInput=v=>v?new Date(v).toISOString():null;

const CATS=[['scholarship','Scholarships'],['exchange','Exchanges'],['international','International'],['internship','Internships'],['university','University'],['conference','Conferences'],['competition','Competitions'],['fellowship','Fellowships'],['training','Training'],['volunteering','Volunteering'],['entrepreneurship','Entrepreneurship'],['mentorship','Mentorship']];
const FUND=[['fully_funded','Fully funded'],['partially_funded','Partially funded'],['self_funded','Self-funded'],['not_applicable','Not applicable']];
const OSTATUS=[['open','Open'],['closing_soon','Closing soon'],['closed','Closed']];
const CSTATUS=[['draft','Draft'],['published','Published'],['archived','Archived']];
const AUDIENCE=[['all','Everyone'],['staff','Staff only'],['board','Board only']];
const ROLES=[['member','Member'],['volunteer','Volunteer'],['staff','Staff'],['board','Board Member'],['admin','Administrator'],['superadmin','Super Administrator']];
const PERM_TAGS=['opportunities','programs','news','events','partners','resources','content','volunteers','hr','finance','safeguarding','comms','governance'];
const SOCIALS=['facebook','instagram','x','linkedin','youtube','tiktok','threads','website'];
const PROJ_STATUS=[['active','Active'],['on_hold','On hold'],['completed','Completed'],['archived','Archived']];
const TASK_STATUS=[['todo','To do'],['in_progress','In progress'],['blocked','Blocked'],['done','Done']];
const PRIORITY=[['low','Low'],['normal','Normal'],['high','High'],['urgent','Urgent']];
const JOB_STATUS=[['open','Open'],['closed','Closed']];
const LEAVE_TYPE=[['annual','Annual leave'],['sick','Sick leave'],['unpaid','Unpaid leave'],['study','Study leave'],['other','Other']];
const LEAVE_STATUS=[['pending','Pending'],['approved','Approved'],['rejected','Rejected']];
const ATT_STATUS=[['present','Present'],['absent','Absent'],['leave','On leave'],['remote','Remote']];
const MTG_STATUS=[['scheduled','Scheduled'],['held','Held'],['cancelled','Cancelled']];
const RES_STATUS=[['open','Open'],['passed','Passed'],['rejected','Rejected'],['withdrawn','Withdrawn']];
const EXP_STATUS=[['pending','Pending'],['approved','Approved'],['rejected','Rejected'],['paid','Paid']];

const RES={
  opportunities:{label:'Opportunities',icon:'fa-compass',perm:['opportunities','content'],table:'opportunities',order:['created_at',false],list:['title','category','status','deadline'],pub:{f:'is_published'},fields:[
    {k:'title',t:'text',req:1,label:'Title'},{k:'slug',t:'slug',label:'Slug (URL)'},
    {k:'category',t:'select',opts:CATS},{k:'status',t:'select',opts:OSTATUS},
    {k:'organization',t:'text',label:'Organisation'},{k:'location',t:'text'},
    {k:'summary',t:'textarea',label:'Short summary'},
    {k:'description',t:'rich',label:'About this opportunity'},
    {k:'eligibility',t:'rich',label:'Who can apply'},
    {k:'benefits',t:'rich',label:"What's on offer"},
    {k:'application_url',t:'text',label:'Application link (URL)'},
    {k:'deadline',t:'date'},{k:'funding',t:'select',opts:FUND},{k:'level',t:'text'},
    {k:'cover_url',t:'image',label:'Cover image'},{k:'source',t:'text'},{k:'tags',t:'tags'},
    {k:'is_featured',t:'bool',label:'Feature this'},{k:'is_published',t:'bool',label:'Published (live on site)'}
  ]},
  programs:{label:'Programmes',icon:'fa-diagram-project',perm:['programs','content'],table:'programs',order:['sort_order',true],list:['title','is_flagship'],pub:{f:'is_published'},fields:[
    {k:'title',t:'text',req:1},{k:'slug',t:'slug',label:'Slug (URL)'},
    {k:'department_id',t:'ref',ref:'departments',label:'Pillar / area'},
    {k:'summary',t:'textarea',label:'Short summary'},{k:'description',t:'rich',label:'Full description'},
    {k:'cover_url',t:'image',label:'Cover image'},{k:'tags',t:'tags'},
    {k:'sort_order',t:'number',label:'Sort order'},
    {k:'is_flagship',t:'bool',label:'Flagship programme'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  news_posts:{label:'News',icon:'fa-newspaper',perm:['news','content'],table:'news_posts',order:['published_at',false],list:['title','category','status'],pub:{f:'status',on:'published',off:'draft'},fields:[
    {k:'title',t:'text',req:1},{k:'slug',t:'slug',label:'Slug (URL)'},
    {k:'category',t:'text',label:'Category'},{k:'status',t:'select',opts:CSTATUS},
    {k:'excerpt',t:'textarea',label:'Excerpt / summary'},{k:'body',t:'rich',label:'Article body'},
    {k:'cover_url',t:'image',label:'Cover image'},{k:'tags',t:'tags'},
    {k:'published_at',t:'datetime',label:'Publish date'}
  ]},
  events:{label:'Events',icon:'fa-calendar-day',perm:['events','content'],table:'events',order:['starts_at',false],list:['title','starts_at','location'],pub:{f:'is_published'},fields:[
    {k:'title',t:'text',req:1},{k:'slug',t:'slug',label:'Slug (URL)'},
    {k:'starts_at',t:'datetime',label:'Starts'},{k:'ends_at',t:'datetime',label:'Ends'},
    {k:'location',t:'text'},{k:'description',t:'rich',label:'About this event'},
    {k:'cover_url',t:'image',label:'Cover image'},{k:'registration_url',t:'text',label:'External registration link (leave blank for built-in RSVP)'},
    {k:'is_featured',t:'bool',label:'Feature this'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  partners:{label:'Partners',icon:'fa-handshake',perm:['partners','content'],table:'partners',order:['sort_order',true],list:['name','tier'],pub:{f:'is_published'},fields:[
    {k:'name',t:'text',req:1},{k:'logo_url',t:'image',label:'Logo'},{k:'url',t:'text',label:'Website'},
    {k:'description',t:'textarea'},{k:'tier',t:'text',label:'Tier (e.g. Gold, Strategic)'},
    {k:'sort_order',t:'number'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  resources:{label:'Resources',icon:'fa-folder-open',perm:['resources','content'],table:'resources',order:['sort_order',true],list:['title','category'],pub:{f:'is_published'},fields:[
    {k:'title',t:'text',req:1},{k:'category',t:'text'},{k:'description',t:'textarea'},
    {k:'file_url',t:'file',label:'File (upload)'},{k:'link_url',t:'text',label:'Or external link'},
    {k:'sort_order',t:'number'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  faqs:{label:'FAQs',icon:'fa-circle-question',perm:['content'],table:'faqs',order:['sort_order',true],list:['question','category'],pub:{f:'is_published'},fields:[
    {k:'question',t:'text',req:1},{k:'answer',t:'textarea',req:1},{k:'category',t:'text'},
    {k:'sort_order',t:'number'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  impact_stats:{label:'Impact stats',icon:'fa-chart-simple',perm:['content'],table:'impact_stats',order:['sort_order',true],list:['label','value'],pub:{f:'is_published'},fields:[
    {k:'value',t:'text',req:1,label:'Value (e.g. 500+)'},{k:'label',t:'text',req:1,label:'Label (e.g. Young people reached)'},
    {k:'icon',t:'text',label:'Icon (Font Awesome name, optional)'},{k:'sort_order',t:'number'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  about_team:{label:'Board & Team',icon:'fa-users',perm:['content','governance'],table:'about_team',order:['sort_order',true],list:['name','role'],pub:{f:'is_published'},fields:[
    {k:'name',t:'text',req:1},{k:'role',t:'text',req:1,label:'Role / title'},{k:'portfolio',t:'text',label:'Portfolio / department'},
    {k:'bio',t:'textarea'},{k:'photo_url',t:'image',label:'Photo'},{k:'email',t:'text'},
    {k:'socials',t:'social',label:'Social links'},{k:'sort_order',t:'number'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  departments:{label:'Pillars / Departments',icon:'fa-sitemap',perm:['content','governance'],table:'departments',order:['sort_order',true],list:['name'],pub:{f:'is_published'},fields:[
    {k:'name',t:'text',req:1},{k:'slug',t:'slug',label:'Slug'},{k:'description',t:'textarea'},
    {k:'icon',t:'text',label:'Icon (optional)'},{k:'sort_order',t:'number'},{k:'is_published',t:'bool',label:'Published'}
  ]},
  announcements:{label:'Announcements',icon:'fa-bullhorn',perm:['comms'],table:'announcements',order:['created_at',false],list:['title','audience'],pub:null,stampMe:'author_id',fields:[
    {k:'title',t:'text',req:1},{k:'body',t:'textarea'},{k:'audience',t:'select',opts:AUDIENCE},{k:'is_pinned',t:'bool',label:'Pin to top'}
  ]},

  /* ---- PROJECTS (any staff) ---- */
  projects:{label:'Projects',icon:'fa-folder-tree',perm:['__staff__'],table:'projects',order:['created_at',false],list:['name','status','department_id','lead_id'],pub:null,fields:[
    {k:'name',t:'text',req:1},{k:'description',t:'textarea'},
    {k:'department_id',t:'ref',ref:'departments',label:'Department'},
    {k:'lead_id',t:'ref',ref:'profiles',label:'Project lead'},
    {k:'status',t:'select',opts:PROJ_STATUS}
  ]},
  tasks:{label:'Tasks',icon:'fa-list-check',perm:['__staff__'],table:'tasks',order:['created_at',false],list:['title','status','priority','assignee_id','due_date'],pub:null,stampMe:'created_by',fields:[
    {k:'title',t:'text',req:1},{k:'description',t:'textarea'},
    {k:'project_id',t:'ref',ref:'projects',label:'Project'},
    {k:'department_id',t:'ref',ref:'departments',label:'Department'},
    {k:'assignee_id',t:'ref',ref:'profiles',label:'Assigned to'},
    {k:'status',t:'select',opts:TASK_STATUS},{k:'priority',t:'select',opts:PRIORITY},{k:'due_date',t:'date'}
  ]},

  /* ---- HR (perm 'hr') ---- */
  job_postings:{label:'Job postings',icon:'fa-briefcase',perm:['hr'],table:'job_postings',order:['created_at',false],list:['title','status','location'],pub:{f:'is_published'},fields:[
    {k:'title',t:'text',req:1},{k:'slug',t:'slug',label:'Slug (URL)'},
    {k:'department_id',t:'ref',ref:'departments',label:'Department'},
    {k:'description',t:'rich',label:'Job description'},{k:'location',t:'text'},
    {k:'type',t:'text',label:'Type (e.g. Full-time, Volunteer)'},{k:'status',t:'select',opts:JOB_STATUS},
    {k:'is_published',t:'bool',label:'Published on site'}
  ]},
  hr_leave_requests:{label:'Leave requests',icon:'fa-plane-departure',perm:['hr'],table:'hr_leave_requests',order:['created_at',false],list:['type','profile_id','status','start_date'],pub:null,fields:[
    {k:'type',t:'select',opts:LEAVE_TYPE,req:1},
    {k:'profile_id',t:'ref',ref:'profiles',label:'Team member',req:1},
    {k:'start_date',t:'date'},{k:'end_date',t:'date'},{k:'reason',t:'textarea'},
    {k:'status',t:'select',opts:LEAVE_STATUS}
  ]},
  hr_attendance:{label:'Attendance',icon:'fa-user-clock',perm:['hr'],table:'hr_attendance',order:['attend_date',false],list:['attend_date','profile_id','status'],pub:null,fields:[
    {k:'attend_date',t:'date',req:1,label:'Date'},
    {k:'profile_id',t:'ref',ref:'profiles',label:'Team member',req:1},
    {k:'status',t:'select',opts:ATT_STATUS},{k:'check_in',t:'datetime'},{k:'check_out',t:'datetime'}
  ]},
  onboarding_tasks:{label:'Onboarding',icon:'fa-clipboard-list',perm:['hr'],table:'onboarding_tasks',order:['sort_order',true],list:['task','profile_id','is_done'],pub:null,fields:[
    {k:'task',t:'text',req:1,label:'Task'},
    {k:'profile_id',t:'ref',ref:'profiles',label:'For team member',req:1},
    {k:'is_done',t:'bool',label:'Completed'},{k:'sort_order',t:'number'}
  ]},
  hr_documents:{label:'HR documents',icon:'fa-file-shield',perm:['hr'],table:'hr_documents',order:['created_at',false],list:['title','category','profile_id'],pub:null,fields:[
    {k:'title',t:'text',req:1},{k:'profile_id',t:'ref',ref:'profiles',label:'Relates to (optional)'},
    {k:'category',t:'text'},{k:'file_url',t:'file',label:'File'}
  ]},

  /* ---- GOVERNANCE (perm 'governance' / board) ---- */
  meetings:{label:'Meetings',icon:'fa-people-group',perm:['governance'],table:'meetings',order:['scheduled_at',false],list:['title','scheduled_at','status'],pub:null,stampMe:'created_by',fields:[
    {k:'title',t:'text',req:1},{k:'scheduled_at',t:'datetime',label:'Date & time'},{k:'location',t:'text'},
    {k:'agenda',t:'rich',label:'Agenda'},{k:'minutes',t:'rich',label:'Minutes'},{k:'status',t:'select',opts:MTG_STATUS}
  ]},
  resolutions:{label:'Resolutions',icon:'fa-gavel',perm:['governance'],table:'resolutions',order:['created_at',false],list:['title','status','meeting_id'],pub:null,fields:[
    {k:'title',t:'text',req:1},{k:'meeting_id',t:'ref',ref:'meetings',label:'Related meeting'},
    {k:'description',t:'rich',label:'Details'},{k:'status',t:'select',opts:RES_STATUS}
  ]},
  board_documents:{label:'Board documents',icon:'fa-folder-closed',perm:['governance'],table:'board_documents',order:['created_at',false],list:['title','category'],pub:null,stampMe:'uploaded_by',fields:[
    {k:'title',t:'text',req:1},{k:'category',t:'text'},{k:'file_url',t:'file',label:'File'}
  ]},

  /* ---- FINANCE (perm 'finance' / board) ---- */
  budgets:{label:'Budgets',icon:'fa-scale-balanced',perm:['finance'],table:'budgets',order:['created_at',false],list:['name','amount','period'],pub:null,fields:[
    {k:'name',t:'text',req:1},{k:'department_id',t:'ref',ref:'departments',label:'Department'},
    {k:'amount',t:'number',label:'Amount (SCR)'},{k:'period',t:'text',label:'Period (e.g. 2025)'},{k:'notes',t:'textarea'}
  ]},
  expenses:{label:'Expenses',icon:'fa-receipt',perm:['finance'],table:'expenses',order:['created_at',false],list:['description','amount','status'],pub:null,stampMe:'submitted_by',fields:[
    {k:'description',t:'text',req:1},{k:'amount',t:'number',req:1,label:'Amount (SCR)'},{k:'category',t:'text'},
    {k:'department_id',t:'ref',ref:'departments',label:'Department'},
    {k:'status',t:'select',opts:EXP_STATUS},{k:'receipt_url',t:'file',label:'Receipt'}

      set(`<i class="fa-solid fa-temperature-half text-xs opacity-70"></i><span>${t}&deg;C${desc?' · '+esc(desc):''}${loc?' · '+esc(loc):''}</span>`);

  };

}

        <p id="cl-notif-msg" class="text-sm font-semibold mt-3"></p>
      </div>
    </div>`;
  const run=async(btn,build,msgEl)=>{

    const m=$(msgEl); btn.disabled=true; const old=btn.textContent; btn.textContent='Working…';

  };

let PROFILES=null, PROFMAP={};

/* ===================== NOTIFICATIONS ===================== */
let NOTIFS=[]; let notifChan=null;
const NIC={task:'fa-list-check',document:'fa-file-lines',announcement:'fa-bullhorn',leave:'fa-plane-departure',system:'fa-circle-info',general:'fa-bell'};
function unreadCount(){ return NOTIFS.filter(n=>!n.is_read).length; }
function timeAgo(iso){ const d=new Date(iso), s=(Date.now()-d.getTime())/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; if(s<604800)return Math.floor(s/86400)+'d ago'; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function renderBell(){
  const badge=$('bell-badge'), list=$('bell-list'), u=unreadCount();
  if(u>0){badge.textContent=u>99?'99+':u;badge.classList.remove('hidden');}else{badge.classList.add('hidden');}
  if(!NOTIFS.length){list.innerHTML='<div class="px-4 py-10 text-center text-gray-400 text-sm">No notifications yet</div>';return;}
  list.innerHTML=NOTIFS.map(n=>`<button data-nid="${n.id}" class="notif-item w-full text-left flex gap-3 px-4 py-3 border-b border-gray-50 hover:bg-gray-50 transition-colors ${n.is_read?'':'bg-tnf-greenLight/40'}"><div class="w-8 h-8 rounded-lg bg-tnf-greenLight text-tnf-green grid place-items-center flex-none text-sm"><i class="fa-solid ${NIC[n.type]||NIC.general}"></i></div><div class="min-w-0 flex-1"><div class="text-sm font-semibold text-tnf-ink truncate">${esc(n.title)}</div>${n.body?`<div class="text-xs text-gray-500 line-clamp-2">${esc(n.body)}</div>`:''}<div class="text-[11px] text-gray-400 mt-0.5">${timeAgo(n.created_at)}</div></div>${n.is_read?'':'<span class="w-2 h-2 rounded-full bg-tnf-green flex-none mt-1.5"></span>'}</button>`).join('');
  list.querySelectorAll('.notif-item').forEach(b=>b.addEventListener('click',async()=>{
    const n=NOTIFS.find(x=>x.id===b.dataset.nid);
    await markNotifRead(b.dataset.nid);
    $('bell-panel').classList.add('hidden');
    if(n){ if(n.type==='document')route('documents'); else if(n.type==='task')route('tasks'); }
  }));
}
async function loadNotifs(){ try{const{data}=await db.from('notifications').select('*').eq('user_id',ME.id).order('created_at',{ascending:false}).limit(30);NOTIFS=data||[];}catch(e){NOTIFS=[];} renderBell(); }
async function markNotifRead(id){ const n=NOTIFS.find(x=>x.id===id); if(n&&!n.is_read){n.is_read=true;renderBell();try{await db.from('notifications').update({is_read:true}).eq('id',id);}catch(e){}} }
async function markAllRead(){ const ids=NOTIFS.filter(n=>!n.is_read).map(n=>n.id); if(!ids.length)return; NOTIFS.forEach(n=>n.is_read=true); renderBell(); try{await db.from('notifications').update({is_read:true}).in('id',ids);}catch(e){} }
function initNotifications(){
  loadNotifs();
  $('bell-btn').addEventListener('click',e=>{e.stopPropagation();$('bell-panel').classList.toggle('hidden');});
  $('bell-readall').addEventListener('click',markAllRead);
  document.addEventListener('click',e=>{ const p=$('bell-panel'),b=$('bell-btn'); if(p&&!p.classList.contains('hidden')&&!p.contains(e.target)&&!b.contains(e.target))p.classList.add('hidden'); });
  try{ notifChan=db.channel('notif-'+ME.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+ME.id},payload=>{ NOTIFS.unshift(payload.new); if(NOTIFS.length>30)NOTIFS.pop(); renderBell(); }).subscribe(); }catch(e){}
  setInterval(loadNotifs,45000);
}

/* ===================== DOCUMENTS ===================== */
let DOCTAB='inbox';
function docModal(html){ const ov=document.createElement('div'); ov.className='fixed inset-0 bg-black/50 z-[60] flex items-start justify-center overflow-y-auto p-4'; ov.innerHTML=`<div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg my-8">${html}</div>`; ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();}); document.body.appendChild(ov); return ov; }
async function renderDocuments(){
  await loadProfiles();
  const c=$('content');
  c.innerHTML=`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div class="inline-flex bg-gray-100 rounded-lg p-1 text-sm font-semibold self-start">
        <button data-tab="inbox" class="doc-tab px-4 py-2 rounded-md">Inbox <span id="doc-inbox-count"></span></button>
        <button data-tab="sent" class="doc-tab px-4 py-2 rounded-md">Sent</button>
      </div>
      <button id="doc-compose" class="bg-tnf-green hover:bg-tnf-greenDark text-white text-sm font-bold px-4 py-2.5 rounded-lg self-start"><i class="fa-solid fa-pen-to-square mr-1.5"></i>New document</button>
    </div>
    <div id="doc-body"><div class="text-gray-400 text-sm py-10 text-center">Loading…</div></div>`;
  c.querySelectorAll('.doc-tab').forEach(b=>b.addEventListener('click',()=>{DOCTAB=b.dataset.tab;paintDocTabs();loadDocs();}));
  $('doc-compose').addEventListener('click',composeDoc);
  paintDocTabs(); loadDocs();
}
function paintDocTabs(){ document.querySelectorAll('.doc-tab').forEach(b=>{const on=b.dataset.tab===DOCTAB;b.classList.toggle('bg-white',on);b.classList.toggle('shadow-sm',on);b.classList.toggle('text-tnf-ink',on);b.classList.toggle('text-gray-500',!on);}); }
function emptyDoc(tab){ return `<div class="bg-white rounded-2xl border border-gray-100 p-12 text-center"><div class="w-14 h-14 rounded-2xl bg-tnf-greenLight text-tnf-green grid place-items-center text-2xl mx-auto mb-4"><i class="fa-solid fa-file-lines"></i></div><h3 class="text-lg font-bold text-tnf-ink mb-1">${tab==='inbox'?'No documents received':'Nothing sent yet'}</h3><p class="text-gray-500 text-sm">${tab==='inbox'?'Documents shared with you will appear here.':'Documents you send to staff will appear here.'}</p></div>`; }
function docCard(d,opts){ return `<button data-doc="${d.id}" class="doc-card w-full text-left bg-white rounded-2xl border ${opts.unread?'border-tnf-green':'border-gray-100'} shadow-sm hover:shadow-md p-5 transition-all flex items-start gap-4"><div class="w-10 h-10 rounded-xl bg-tnf-greenLight text-tnf-green grid place-items-center flex-none"><i class="fa-solid fa-file-lines"></i></div><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><h3 class="font-bold text-tnf-ink truncate">${esc(d.title)}</h3>${opts.unread?'<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-tnf-green text-white flex-none">NEW</span>':''}</div><div class="text-xs text-gray-400 mt-0.5">${esc(d.category||'General')} · ${opts.sent?'sent by you':'from '+esc(opts.from)} · ${new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div></div><i class="fa-solid fa-chevron-right text-gray-300 mt-1"></i></button>`; }
async function loadDocs(){
  const box=$('doc-body'); box.innerHTML='<div class="text-gray-400 text-sm py-10 text-center">Loading…</div>';
  if(DOCTAB==='inbox'){
    let rows=[];
    try{const{data}=await db.from('internal_document_recipients').select('is_read,doc:internal_documents(id,title,content,category,author_id,created_at)').eq('profile_id',ME.id);rows=(data||[]).filter(r=>r.doc);}catch(e){}
    rows.sort((a,b)=>new Date(b.doc.created_at)-new Date(a.doc.created_at));
    const cnt=$('doc-inbox-count'), unread=rows.filter(r=>!r.is_read).length; if(cnt)cnt.textContent=unread?`(${unread})`:'';
    if(!rows.length){box.innerHTML=emptyDoc('inbox');return;}
    box.innerHTML=`<div class="space-y-3">${rows.map(r=>docCard(r.doc,{unread:!r.is_read,from:pname(r.doc.author_id)})).join('')}</div>`;
    box.querySelectorAll('.doc-card').forEach(b=>b.addEventListener('click',()=>openDoc(b.dataset.doc,'inbox')));
  } else {
    let rows=[];
    try{const{data}=await db.from('internal_documents').select('*').eq('author_id',ME.id).order('created_at',{ascending:false});rows=data||[];}catch(e){}
    if(!rows.length){box.innerHTML=emptyDoc('sent');return;}
    box.innerHTML=`<div class="space-y-3">${rows.map(d=>docCard(d,{sent:true})).join('')}</div>`;
    box.querySelectorAll('.doc-card').forEach(b=>b.addEventListener('click',()=>openDoc(b.dataset.doc,'sent')));
  }
}
async function openDoc(id,tab){
  let d=null; try{const{data}=await db.from('internal_documents').select('*').eq('id',id).maybeSingle();d=data;}catch(e){}
  if(!d)return;
  let recipHtml='';
  if(tab==='sent'){ try{const{data}=await db.from('internal_document_recipients').select('profile_id,is_read').eq('document_id',id);const rs=data||[];await loadProfiles();recipHtml=`<div class="mt-6 pt-4 border-t border-gray-100"><div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Recipients (${rs.length})</div><div class="flex flex-wrap gap-2">${rs.map(r=>`<span class="text-xs px-2.5 py-1 rounded-full ${r.is_read?'bg-tnf-greenLight text-tnf-greenDark':'bg-gray-100 text-gray-500'}">${esc(pname(r.profile_id))}${r.is_read?' · read':''}</span>`).join('')}</div></div>`;}catch(e){} }
  const body=esc(d.content||'')||'<span class="text-gray-400 italic">(No content)</span>';
  const ov=docModal(`<div class="flex items-center justify-between px-6 py-4 border-b border-gray-100"><div class="min-w-0"><h3 class="font-bold text-lg text-tnf-ink truncate">${esc(d.title)}</h3><div class="text-xs text-gray-400">${esc(d.category||'General')} · ${new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}${tab==='inbox'?' · from '+esc(pname(d.author_id)):''}</div></div><button class="dm-x text-gray-400 hover:text-gray-600 text-2xl leading-none flex-none">&times;</button></div><div class="p-6"><div class="text-gray-700 leading-relaxed whitespace-pre-wrap">${body}</div>${recipHtml}</div>`);
  ov.querySelectorAll('.dm-x').forEach(b=>b.addEventListener('click',()=>ov.remove()));
  if(tab==='inbox'){ try{await db.from('internal_document_recipients').update({is_read:true,read_at:new Date().toISOString()}).eq('document_id',id).eq('profile_id',ME.id);}catch(e){} loadDocs(); }
}

  await loadProfiles();
  const recips=PROFILES.filter(p=>p.id!==ME.id && p.is_active!==false);
  const ov=docModal(`<div class="flex items-center justify-between px-6 py-4 border-b border-gray-100"><h3 class="font-bold text-lg text-tnf-ink">New document</h3><button class="dm-x text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button></div>

      <div><label class="block text-sm font-semibold text-tnf-ink mb-1.5">Category</label><input id="dm-cat" value="General" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:border-tnf-green outline-none" placeholder="e.g. Policy, Memo, Report"></div>

        <div class="flex items-center justify-between mb-1"><button type="button" id="dm-all" class="text-xs font-semibold text-tnf-green">Select all</button><span id="dm-sel" class="text-xs text-gray-400">0 selected</span></div>
        <div id="dm-recips" class="max-h-48 overflow-y-auto border border-gray-100 rounded-lg divide-y divide-gray-50">${recips.length?recips.map(p=>`<label class="flex items-center gap-3 px-3 py-2 hover:bg-gray-50 cursor-pointer text-sm"><input type="checkbox" class="dm-r accent-tnf-green" value="${p.id}"><span class="flex-1">${esc(p.full_name||p.email)}</span><span class="text-[11px] text-gray-400">${esc((ROLES.find(r=>r[0]===p.role)||[])[1]||p.role)}</span></label>`).join(''):'<div class="px-3 py-4 text-sm text-gray-400 text-center">No other people to send to yet</div>'}</div>
      </div>

    </div>`);

  ov.querySelector('#dm-all').addEventListener('click',()=>{const vis=[...ov.querySelectorAll('#dm-recips label')].filter(l=>l.style.display!=='none').map(l=>l.querySelector('.dm-r'));const anyOff=vis.some(b=>!b.checked);vis.forEach(b=>b.checked=anyOff);upd();});
  ov.querySelector('#dm-search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();ov.querySelectorAll('#dm-recips label').forEach(l=>{l.style.display=l.textContent.toLowerCase().includes(q)?'':'none';});});
  ov.querySelector('#dm-send').addEventListener('click',async()=>{

  });
}

    if(error)throw error;
    toast(editing?'Saved':'Created'); REFCACHE={};REFMAP={}; renderList(key,res);
  }catch(e){ toast(e.message||'Save failed',false); btn.disabled=false; btn.innerHTML=old; }
}

async function renderInbox(k,cfg){
  const c=$('content');
  if(cfg.sensitive) c.innerHTML=`<div class="bg-red-50 border border-red-100 rounded-xl p-4 text-sm text-red-700 mb-5"><i class="fa-solid fa-lock mr-1.5"></i>Confidential. Handle these reports with care and in line with our safeguarding policy.</div><div id="ibody"><div class="loader-spinner my-10"></div></div>`;
  else c.innerHTML=`<div id="ibody"><div class="loader-spinner my-10"></div></div>`;
  let rows=[];
  try{ const{data,error}=await db.from(cfg.table).select('*').order('created_at',{ascending:false}); if(error)throw error; rows=data||[]; }
  catch(e){ $('ibody').innerHTML=`<p class="text-gray-400 text-sm italic">Nothing to show, or you don't have access to these.</p>`; return; }
  if(!rows.length){ $('ibody').innerHTML=`<div class="bg-white rounded-2xl border border-gray-100 p-10 text-center text-gray-400">No entries yet.</div>`; return; }
  const hide=['id','event_id','job_id','reviewed_by','author_id','updated_at','search_vector'];
  $('ibody').innerHTML=`<p class="text-gray-400 text-sm mb-4">${rows.length} ${rows.length===1?'entry':'entries'}</p><div class="space-y-3">${rows.map(r=>{
    const fields=Object.keys(r).filter(kk=>!hide.includes(kk)&&r[kk]!=null&&r[kk]!==''&&!(Array.isArray(r[kk])&&!r[kk].length));
    const created=r.created_at?fmtDateTime(r.created_at):'';
    return `<div class="bg-white rounded-2xl border border-gray-100 p-5"><div class="flex justify-between items-start mb-2"><div class="font-bold text-tnf-ink">${esc(r.name||r.title||r.subject||r.email||r.donor_name||'Entry')}</div><div class="text-xs text-gray-400 whitespace-nowrap ml-3">${created}</div></div><div class="space-y-1.5 text-sm">${fields.filter(kk=>kk!=='created_at'&&kk!=='name'&&kk!=='title').map(kk=>{let val=r[kk];if(Array.isArray(val))val=val.join(', ');if(typeof val==='string'&&/^\d{4}-\d\d-\d\dT/.test(val))val=fmtDateTime(val);return `<div><span class="text-gray-400 font-semibold">${esc(kk.replace(/_/g,' '))}:</span> <span class="text-gray-700">${esc(val)}</span></div>`;}).join('')}</div></div>`;
  }).join('')}</div>`;
}

async function renderUsers(){
  const c=$('content');
  c.innerHTML=`<p class="text-gray-500 mb-6">Manage who has access and what they can do. Only administrators can change roles and permissions.</p><div id="ubody"><div class="loader-spinner my-10"></div></div>`;
  let rows=[];
  try{const{data,error}=await db.from('profiles').select('*').order('created_at',{ascending:true});if(error)throw error;rows=data||[];}
  catch(e){$('ubody').innerHTML=`<p class="text-red-600 text-sm">${esc(e.message)}</p>`;return;}
  $('ubody').innerHTML=`<div class="bg-white rounded-2xl border border-gray-100 divide-y divide-gray-100">${rows.map(u=>`<div class="flex items-center gap-4 p-4"><div class="w-10 h-10 rounded-full bg-tnf-greenLight text-tnf-greenDark grid place-items-center font-bold flex-none">${esc((u.full_name||u.email||'?').trim()[0].toUpperCase())}</div><div class="flex-1 min-w-0"><div class="font-semibold text-tnf-ink truncate">${esc(u.full_name||'(no name)')} ${u.id===ME.id?'<span class=\"text-xs text-gray-400\">(you)</span>':''}</div><div class="text-xs text-gray-400 truncate">${esc(u.email||'')}</div></div><span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${['admin','superadmin'].includes(u.role)?'bg-tnf-greenLight text-tnf-greenDark':'bg-gray-100 text-gray-500'}">${esc((ROLES.find(r=>r[0]===u.role)||[])[1]||u.role)}</span>${u.is_active===false?'<span class=\"text-[11px] font-bold px-2 py-1 rounded-full bg-red-50 text-red-600\">Inactive</span>':''}<button class="uedit text-gray-400 hover:text-tnf-green px-2" data-id="${u.id}"><i class="fa-solid fa-pen"></i></button></div>`).join('')}</div>`;
  $('ubody').querySelectorAll('.uedit').forEach(b=>b.onclick=()=>editUser(rows.find(x=>x.id===b.dataset.id)));
}
async function editUser(u){
  await loadRef('departments');
  const c=$('content'); $('page-title').textContent='Edit user';
  c.innerHTML=`<button id="uback" class="text-sm font-bold text-tnf-green mb-5"><i class="fa-solid fa-arrow-left mr-2"></i>Back to users</button>
  <form id="uform" class="bg-white rounded-2xl border border-gray-100 p-6 md:p-8 space-y-6 max-w-2xl">
    <div><div class="font-bold text-tnf-ink text-lg">${esc(u.full_name||'(no name)')}</div><div class="text-gray-400 text-sm">${esc(u.email||'')}</div></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-2">Role</label><select id="u_role" class="w-full border border-gray-200 rounded-xl px-4 py-3 bg-white">${ROLES.map(r=>`<option value="${r[0]}" ${u.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-2">Title (job title)</label><input id="u_title" value="${esc(u.title||'')}" class="w-full border border-gray-200 rounded-xl px-4 py-3"/></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-2">Department</label><select id="u_dept" class="w-full border border-gray-200 rounded-xl px-4 py-3 bg-white"><option value="">- none -</option>${(REFCACHE['departments']||[]).map(d=>`<option value="${d.id}" ${u.department_id===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div>
    <div><label class="block text-sm font-semibold text-tnf-ink mb-3">Permissions <span class="text-gray-400 font-normal">· what they can manage</span></label><div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${PERM_TAGS.map(t=>`<label class="flex items-center gap-2 text-sm border border-gray-200 rounded-lg px-3 py-2 cursor-pointer"><input type="checkbox" value="${t}" class="uperm accent-tnf-green" ${(u.permissions||[]).includes(t)?'checked':''}/> ${t}</label>`).join('')}</div><p class="text-xs text-gray-400 mt-2">Administrators have every permission automatically.</p></div>
    <div class="flex items-center justify-between gap-4"><label class="text-sm font-semibold text-tnf-ink">Account active</label><div class="toggle ${u.is_active!==false?'on':''}" id="u_active" data-val="${u.is_active!==false?1:0}"><span></span></div></div>
    <div class="flex items-center gap-3 pt-4 border-t border-gray-100"><button type="submit" id="usave" class="bg-tnf-green hover:bg-tnf-greenDark text-white font-bold px-7 py-3 rounded-xl">Save user</button><button type="button" id="ucancel" class="text-gray-500 font-semibold px-4">Cancel</button></div>
  </form>`;
  $('uback').onclick=renderUsers; $('ucancel').onclick=renderUsers;
  $('u_active').onclick=()=>{const t=$('u_active');const on=t.dataset.val==='1';t.dataset.val=on?'0':'1';t.classList.toggle('on',!on);};
  $('uform').addEventListener('submit',async e=>{e.preventDefault();const btn=$('usave');btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="btn-spin"></span> Saving…';
    const payload={role:$('u_role').value,title:$('u_title').value.trim()||null,department_id:$('u_dept').value||null,permissions:[...document.querySelectorAll('.uperm:checked')].map(x=>x.value),is_active:$('u_active').dataset.val==='1'};
    try{const{error}=await db.from('profiles').update(payload).eq('id',u.id);if(error)throw error;toast('User updated');renderUsers();}catch(err){toast(err.message||'Failed',false);btn.disabled=false;btn.innerHTML=old;}
  });
}

async function renderSettings(){

  c.innerHTML=`<div id="sbody"><div class="loader-spinner my-10"></div></div>`;
  let s={};
  try{const{data}=await db.from('site_settings').select('*').maybeSingle();s=data||{id:true};}catch(e){s={id:true};}
  const social=s.social_links||{};
  const inp=(id,val,ph='')=>`<input id="${id}" value="${esc(val||'')}" placeholder="${ph}" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:border-tnf-green focus:ring-4 focus:ring-tnf-green/10"/>`;
  const ta=(id,val)=>`<textarea id="${id}" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 resize-y focus:border-tnf-green focus:ring-4 focus:ring-tnf-green/10">${esc(val||'')}</textarea>`;
  const card=(title,inner)=>`<div class="bg-white rounded-2xl border border-gray-100 p-6 md:p-8 space-y-5"><h3 class="font-bold text-tnf-ink">${title}</h3>${inner}</div>`;
  const fld=(l,el)=>`<div><label class="block text-sm font-semibold text-tnf-ink mb-2">${l}</label>${el}</div>`;
  $('sbody').innerHTML=`<div class="space-y-6 max-w-3xl">
    ${card('Homepage hero',fld('Headline',inp('s_hero_headline',s.hero_headline))+fld('Sub-headline',ta('s_hero_subheadline',s.hero_subheadline)))}
    ${card('Mission & vision',fld('Mission heading',inp('s_mission_heading',s.mission_heading))+fld('Mission text',ta('s_mission_text',s.mission_text))+fld('Vision text',ta('s_vision_text',s.vision_text)))}
    ${card('About',fld('About heading',inp('s_about_heading',s.about_heading))+fld('About body',ta('s_about_body',s.about_body)))}
    ${card('Founder',fld('Name',inp('s_founder_name',s.founder_name))+fld('Role',inp('s_founder_role',s.founder_role))+fld('Message',ta('s_founder_message',s.founder_message))+fld('Portrait image URL',inp('s_founder_image',s.founder_image)))}
    ${card('Announcement bar',`<div class="flex items-center justify-between gap-4"><label class="text-sm font-semibold text-tnf-ink">Show announcement bar</label><div class="toggle ${s.announcement_active?'on':''}" id="s_announcement_active" data-val="${s.announcement_active?1:0}"><span></span></div></div>`+fld('Text',inp('s_announcement_text',s.announcement_text))+fld('Link (optional)',inp('s_announcement_url',s.announcement_url)))}
    ${card('Contact',fld('Email',inp('s_contact_email',s.contact_email))+fld('Phone',inp('s_contact_phone',s.contact_phone))+fld('Address',ta('s_contact_address',s.contact_address))+fld('Office hours',inp('s_office_hours',s.office_hours)))}
    ${card('Social links',`<div class="grid grid-cols-2 gap-3">${SOCIALS.map(p=>fld(p.charAt(0).toUpperCase()+p.slice(1),inp('soc_'+p,social[p]))).join('')}</div>`)}
    ${card('SEO',fld('Title',inp('s_seo_title',s.seo_title))+fld('Description',ta('s_seo_description',s.seo_description))+fld('Share image URL',inp('s_seo_image',s.seo_image)))}
    <div class="flex items-center gap-3"><button id="ssave" class="bg-tnf-green hover:bg-tnf-greenDark text-white font-bold px-7 py-3 rounded-xl">Save settings</button></div>
  </div>`;
  $('s_announcement_active').onclick=()=>{const t=$('s_announcement_active');const on=t.dataset.val==='1';t.dataset.val=on?'0':'1';t.classList.toggle('on',!on);};
  $('ssave').onclick=async()=>{const btn=$('ssave');btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="btn-spin"></span> Saving…';
    const g=id=>{const e=document.getElementById(id);return e?(e.value.trim()||null):null;};
    const soc={};SOCIALS.forEach(p=>{const v=g('soc_'+p);if(v)soc[p]=v;});
    const payload={id:true,hero_headline:g('s_hero_headline'),hero_subheadline:g('s_hero_subheadline'),mission_heading:g('s_mission_heading'),mission_text:g('s_mission_text'),vision_text:g('s_vision_text'),about_heading:g('s_about_heading'),about_body:g('s_about_body'),founder_name:g('s_founder_name'),founder_role:g('s_founder_role'),founder_message:g('s_founder_message'),founder_image:g('s_founder_image'),announcement_active:$('s_announcement_active').dataset.val==='1',announcement_text:g('s_announcement_text'),announcement_url:g('s_announcement_url'),contact_email:g('s_contact_email'),contact_phone:g('s_contact_phone'),contact_address:g('s_contact_address'),office_hours:g('s_office_hours'),social_links:soc,seo_title:g('s_seo_title'),seo_description:g('s_seo_description'),seo_image:g('s_seo_image')};
    try{const{error}=await db.from('site_settings').upsert(payload,{onConflict:'id'});if(error)throw error;toast('Settings saved');}catch(e){toast(e.message||'Failed',false);}
    btn.disabled=false;btn.innerHTML=old;
  };
}

/* ================= TEAM CHAT ================= */
let CHAT={channel:null,channels:[],open:false};
function chatLayout(showMain){const wide=window.innerWidth>=640;const list=$('ch-list'),main=$('ch-main');if(!list||!main)return;if(wide){list.style.display='flex';main.style.display='flex';}else{list.style.display=showMain?'none':'flex';main.style.display=showMain?'flex':'none';}}
async function renderChat(){
  $('new-btn').classList.add('hidden');
  const c=$('content'); c.classList.remove('max-w-6xl'); c.classList.add('max-w-none');
  c.innerHTML=`<div class="flex gap-4" style="height:calc(100vh - 9rem)">
    <div id="ch-list" class="w-full sm:w-72 flex-none bg-white rounded-2xl border border-gray-100 flex flex-col overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between"><span class="font-bold text-tnf-ink text-sm">Channels</span><button id="ch-new" class="w-7 h-7 rounded-lg bg-tnf-greenLight text-tnf-green hover:bg-tnf-green hover:text-white transition-colors"><i class="fa-solid fa-plus text-xs"></i></button></div>
      <div id="ch-channels" class="flex-1 overflow-y-auto p-2 space-y-1"><div class="loader-spinner my-8 mx-auto"></div></div>
    </div>
    <div id="ch-main" class="hidden sm:flex flex-1 min-w-0 bg-white rounded-2xl border border-gray-100 flex-col overflow-hidden">
      <div class="flex-1 grid place-items-center text-gray-400 text-sm">Select a channel to start chatting</div>
    </div>
  </div>`;
  $('ch-new').onclick=newChannel;
  CHAT.open=false; window.onresize=()=>chatLayout(CHAT.open); chatLayout(false);
  await loadChannels();
}
async function loadChannels(){
  try{const{data,error}=await db.from('chat_channels').select('*').order('created_at',{ascending:true});if(error)throw error;CHAT.channels=data||[];}
  catch(e){$('ch-channels').innerHTML=`<p class="text-gray-400 text-xs p-3">Couldn't load channels.</p>`;return;}
  if(!CHAT.channels.length){$('ch-channels').innerHTML=`<div class="p-4 text-center text-gray-400 text-sm">No channels yet.${isAdmin?' Create one with +':''}</div>`;return;}
  $('ch-channels').innerHTML=CHAT.channels.map(ch=>`<button class="ch-item w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-50 flex items-center gap-2 ${CHAT.channel&&CHAT.channel.id===ch.id?'bg-tnf-greenLight':''}" data-id="${ch.id}"><i class="fa-solid ${ch.type==='dm'?'fa-user':'fa-hashtag'} text-gray-400 text-xs"></i><span class="font-semibold text-sm text-tnf-ink truncate">${esc(ch.name)}</span></button>`).join('');
  $('ch-channels').querySelectorAll('.ch-item').forEach(b=>b.onclick=()=>openChannel(CHAT.channels.find(x=>x.id===b.dataset.id)));
}
async function newChannel(){
  const name=prompt('Channel name:'); if(!name||!name.trim())return;
  try{const{data,error}=await db.from('chat_channels').insert({name:name.trim(),type:'channel',is_private:true,created_by:ME.id}).select().maybeSingle();if(error)throw error;
    try{await db.from('chat_channel_members').insert({channel_id:data.id,profile_id:ME.id,role:'owner'});}catch(_){}
    toast('Channel created'); await loadChannels(); if(data)openChannel(data);
  }catch(e){toast(e.message||'Could not create channel',false);}
}
function openChannel(ch){
  if(!ch)return; CHAT.channel=ch;
  if(window.__chatPoll){clearInterval(window.__chatPoll);window.__chatPoll=null;}
  CHAT.open=true; chatLayout(true); const main=$('ch-main');
  main.innerHTML=`<div class="px-4 py-3 border-b border-gray-100 flex items-center gap-3">
      <button id="ch-back" class="sm:hidden text-gray-400"><i class="fa-solid fa-arrow-left"></i></button>
      <i class="fa-solid fa-hashtag text-gray-400 text-sm"></i><span class="font-bold text-tnf-ink truncate flex-1">${esc(ch.name)}</span>
      ${isAdmin?`<button id="ch-add" class="text-xs font-semibold text-tnf-green hover:text-tnf-greenDark"><i class="fa-solid fa-user-plus mr-1"></i>Add people</button>`:''}
    </div>
    <div id="ch-messages" class="flex-1 overflow-y-auto p-4 space-y-3"><div class="loader-spinner my-8 mx-auto"></div></div>
    <div id="ch-add-panel" class="hidden border-t border-gray-100 p-3 max-h-48 overflow-y-auto"></div>
    <form id="ch-form" class="border-t border-gray-100 p-3 flex items-center gap-2">
      <input id="ch-input" autocomplete="off" placeholder="Write a message…" class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 focus:border-tnf-green focus:ring-4 focus:ring-tnf-green/10"/>
      <button type="submit" class="bg-tnf-green hover:bg-tnf-greenDark text-white w-10 h-10 rounded-xl flex-none"><i class="fa-solid fa-paper-plane"></i></button>
    </form>`;
  const back=$('ch-back'); if(back)back.onclick=()=>{CHAT.open=false;chatLayout(false);if(window.__chatPoll){clearInterval(window.__chatPoll);window.__chatPoll=null;}};
  const add=$('ch-add'); if(add)add.onclick=toggleAddPeople;
  $('ch-form').onsubmit=sendMessage;
  loadMessages(true);
  window.__chatPoll=setInterval(()=>loadMessages(false),4000);
  // reflect active state in list
  document.querySelectorAll('.ch-item').forEach(b=>b.classList.toggle('bg-tnf-greenLight',b.dataset.id===ch.id));
}
async function loadMessages(scroll){
  if(!CHAT.channel)return; const box=$('ch-messages'); if(!box)return;
  let msgs=[];
  try{const{data,error}=await db.from('chat_messages').select('*').eq('channel_id',CHAT.channel.id).order('created_at',{ascending:true}).limit(200);if(error)throw error;msgs=data||[];}
  catch(e){box.innerHTML=`<p class="text-gray-400 text-sm text-center">Couldn't load messages.</p>`;return;}
  if(!msgs.length){box.innerHTML=`<div class="text-center text-gray-400 text-sm py-8">No messages yet. Say hello.</div>`;return;}
  const ids=[...new Set(msgs.map(m=>m.sender_id))]; await loadRef('profiles');
  const nameOf=id=>(REFMAP.profiles&&REFMAP.profiles[id])||'Someone';
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=msgs.map(m=>{const mine=m.sender_id===ME.id;const nm=nameOf(m.sender_id);const canDel=mine||isAdmin;
    return `<div class="flex ${mine?'justify-end':'justify-start'} group"><div class="max-w-[75%]">${mine?'':`<div class="text-[11px] font-bold text-gray-400 mb-0.5 ml-1">${esc(nm)}</div>`}<div class="flex items-center gap-1.5 ${mine?'flex-row':'flex-row-reverse'}">${canDel?`<button class="msg-del opacity-0 group-hover:opacity-100 transition-opacity text-gray-300 hover:text-red-500 text-xs px-1 shrink-0" data-id="${m.id}" title="Delete message"><i class="fa-solid fa-trash-can"></i></button>`:''}<div class="rounded-2xl px-4 py-2 ${mine?'bg-tnf-green text-white rounded-br-sm':'bg-gray-100 text-gray-800 rounded-bl-sm'}"><div class="text-sm whitespace-pre-wrap break-words">${esc(m.body||'')}</div></div></div><div class="text-[10px] text-gray-400 mt-0.5 ${mine?'text-right mr-1':'ml-1'}">${fmtTime(m.created_at)}</div></div></div>`;
  }).join('');
  box.querySelectorAll('.msg-del').forEach(b=>b.addEventListener('click',()=>delMessage(b.dataset.id)));
  if(scroll||atBottom)box.scrollTop=box.scrollHeight;
}
async function delMessage(id){
  if(!confirm('Delete this message?'))return;
  try{const{error}=await db.from('chat_messages').delete().eq('id',id);if(error)throw error;await loadMessages(false);}
  catch(e){toast(e.message||'Could not delete message',false);}
}
async function sendMessage(e){
  e.preventDefault(); const inp=$('ch-input'); const body=inp.value.trim(); if(!body||!CHAT.channel)return;
  inp.value='';
  try{const{error}=await db.from('chat_messages').insert({channel_id:CHAT.channel.id,sender_id:ME.id,body});if(error)throw error;await loadMessages(true);}
  catch(err){toast(err.message||'Message not sent',false);inp.value=body;}
}
async function toggleAddPeople(){
  const panel=$('ch-add-panel'); if(!panel)return;
  if(!panel.classList.contains('hidden')){panel.classList.add('hidden');return;}
  panel.classList.remove('hidden'); panel.innerHTML='<div class="loader-spinner my-4 mx-auto"></div>';
  let staff=[],members=[];
  try{const{data}=await db.from('profiles').select('id,full_name,email,role').in('role',['staff','board','admin','superadmin']).order('full_name');staff=data||[];}catch(e){}
  try{const{data}=await db.from('chat_channel_members').select('profile_id').eq('channel_id',CHAT.channel.id);members=(data||[]).map(m=>m.profile_id);}catch(e){}
  const avail=staff.filter(s=>!members.includes(s.id));
  if(!avail.length){panel.innerHTML='<p class="text-xs text-gray-400 p-2">Everyone is already in this channel.</p>';return;}
  panel.innerHTML=avail.map(s=>`<div class="flex items-center justify-between gap-2 py-1.5"><span class="text-sm text-tnf-ink truncate">${esc(s.full_name||s.email)}</span><button class="addp text-xs font-bold text-tnf-green hover:text-tnf-greenDark" data-id="${s.id}">Add</button></div>`).join('');
  panel.querySelectorAll('.addp').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='…';try{const{error}=await db.from('chat_channel_members').insert({channel_id:CHAT.channel.id,profile_id:b.dataset.id});if(error)throw error;b.textContent='Added';b.classList.add('text-gray-400');}catch(e){toast(e.message||'Could not add',false);b.disabled=false;b.textContent='Add';}});
}
</script>
